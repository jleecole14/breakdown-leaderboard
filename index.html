<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakdown Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff6a00;
            position: relative;
        }

        .header img.logo {
            width: 120px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2.2em;
            color: #ff6a00;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 106, 0, 0.5);
        }

        /* STATS BAR */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px 20px;
            background: #16213e;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #0f3460;
            border: 1px solid #ff6a00;
            border-radius: 8px;
            padding: 10px 20px;
            text-align: center;
            min-width: 120px;
        }

        .stat-card .label {
            font-size: 0.7em;
            color: #ff6a00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 1.3em;
            font-weight: bold;
            color: #ffffff;
        }

        /* TABS */
        .tabs-container {
            padding: 15px 20px 0;
            background: #1a1a2e;
        }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 2px solid #ff6a00;
            padding-bottom: 0;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 16px;
            background: #0f3460;
            border: 1px solid #ff6a00;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            color: #ccc;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .tab:hover {
            background: #ff6a00;
            color: #fff;
        }

        .tab.active {
            background: #ff6a00;
            color: #fff;
            font-weight: bold;
        }

        .tab .delete-drill {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.75em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .tab .delete-drill:hover {
            background: rgba(255,0,0,0.6);
        }

        .add-drill-tab {
            padding: 10px 16px;
            background: transparent;
            border: 1px dashed #ff6a00;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            color: #ff6a00;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .add-drill-tab:hover {
            background: rgba(255, 106, 0, 0.2);
        }

        /* MAIN CONTENT */
        .main-content {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 160px;
        }

        /* DRILL PANEL */
        .drill-panel {
            display: none;
        }

        .drill-panel.active {
            display: block;
        }

        /* ADD SCORE FORM */
        .add-score-form {
            background: #16213e;
            border: 1px solid #ff6a00;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .add-score-form h3 {
            color: #ff6a00;
            margin-bottom: 15px;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-row input {
            flex: 1;
            min-width: 150px;
            padding: 10px 15px;
            background: #0f3460;
            border: 1px solid #ff6a00;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
        }

        .form-row input::placeholder {
            color: #888;
        }

        .form-row input:focus {
            outline: none;
            border-color: #ff9a40;
            box-shadow: 0 0 8px rgba(255, 106, 0, 0.4);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #ff6a00;
            color: #fff;
        }

        .btn-primary:hover {
            background: #ff9a40;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #c0392b;
            color: #fff;
        }

        .btn-danger:hover {
            background: #e74c3c;
        }

        .btn-secondary {
            background: #0f3460;
            color: #fff;
            border: 1px solid #ff6a00;
        }

        .btn-secondary:hover {
            background: #1a4a8a;
        }

        /* LEADERBOARD TABLE */
        .leaderboard-container {
            background: #16213e;
            border: 1px solid #ff6a00;
            border-radius: 12px;
            overflow: hidden;
        }

        .leaderboard-header {
            background: #ff6a00;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leaderboard-header h3 {
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th {
            background: #0f3460;
            padding: 10px 15px;
            text-align: left;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff6a00;
        }

        .leaderboard-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 106, 0, 0.1);
            font-size: 0.95em;
        }

        .leaderboard-table tr:hover {
            background: rgba(255, 106, 0, 0.05);
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.85em;
        }

        .rank-1 { background: #FFD700; color: #000; }
        .rank-2 { background: #C0C0C0; color: #000; }
        .rank-3 { background: #CD7F32; color: #fff; }
        .rank-other { background: #0f3460; color: #fff; }

        .score-time { color: #4ecdc4; font-weight: bold; }
        .score-count { color: #2ecc71; font-weight: bold; }

        .pb-badge {
            background: linear-gradient(135deg, #ff6a00, #ff9a40);
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: bold;
            margin-left: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timestamp {
            font-size: 0.75em;
            color: #888;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            transition: background 0.2s;
        }

        .edit-btn { color: #4ecdc4; }
        .edit-btn:hover { background: rgba(78, 205, 196, 0.2); }
        .delete-btn { color: #e74c3c; }
        .delete-btn:hover { background: rgba(231, 76, 60, 0.2); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .empty-state .icon { font-size: 3em; margin-bottom: 10px; }

        /* DRILL CONTROLS */
        .drill-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        /* MODE TOGGLE */
        .mode-toggle {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            padding: 12px 24px;
            border: 2px solid #ff6a00;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .mode-btn.active {
            background: #ff6a00;
            color: #fff;
        }

        .mode-btn:not(.active) {
            background: rgba(26, 26, 46, 0.95);
            color: #ff6a00;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 106, 0, 0.4);
        }

        /* TV / PRESENTATION MODE */
        .tv-mode {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a1a;
            z-index: 500;
            flex-direction: column;
            overflow: hidden;
        }

        .tv-mode.active {
            display: flex;
        }

        .tv-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px 40px;
            text-align: center;
            border-bottom: 4px solid #ff6a00;
            flex-shrink: 0;
        }

        .tv-header img.logo {
            width: 100px;
            margin-bottom: 8px;
        }

        .tv-header h1 {
            font-size: 3em;
            color: #ff6a00;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(255, 106, 0, 0.7);
        }

        .tv-drill-name {
            font-size: 1.8em;
            color: #ffffff;
            margin-top: 8px;
            letter-spacing: 3px;
        }

        /* TV DRILL NAV */
        .tv-drill-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: #16213e;
            border-bottom: 2px solid rgba(255,106,0,0.3);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .tv-drill-nav-btn {
            padding: 8px 18px;
            background: #0f3460;
            border: 2px solid #ff6a00;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tv-drill-nav-btn:hover {
            background: #ff6a00;
            transform: translateY(-1px);
        }

        .tv-drill-nav-btn.active {
            background: #ff6a00;
            color: #fff;
        }

        .tv-nav-arrow {
            background: none;
            border: 2px solid #ff6a00;
            color: #ff6a00;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tv-nav-arrow:hover {
            background: #ff6a00;
            color: #fff;
        }

        /* TV ROTATION CONTROLS */
        .tv-rotation-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 8px 20px;
            background: #0f3460;
            border-bottom: 1px solid rgba(255,106,0,0.2);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .tv-rotation-controls label {
            color: #ff6a00;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tv-rotation-controls select {
            background: #1a1a2e;
            border: 1px solid #ff6a00;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85em;
        }

        .auto-rotate-btn {
            padding: 6px 16px;
            border: 2px solid #ff6a00;
            border-radius: 15px;
            background: transparent;
            color: #ff6a00;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .auto-rotate-btn.active {
            background: #ff6a00;
            color: #fff;
        }

        .auto-rotate-btn:hover {
            background: #ff6a00;
            color: #fff;
        }

        .drill-indicator {
            color: #888;
            font-size: 0.8em;
        }

        /* TV SCORES */
        .tv-scores-wrapper {
            flex: 1;
            overflow: hidden;
            padding: 10px 40px;
            display: flex;
            flex-direction: column;
        }

        .tv-scores-container {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #ff6a00 #1a1a2e;
        }

        .tv-scores-container::-webkit-scrollbar {
            width: 6px;
        }

        .tv-scores-container::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        .tv-scores-container::-webkit-scrollbar-thumb {
            background: #ff6a00;
            border-radius: 3px;
        }

        .tv-score-row {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 106, 0, 0.15);
            transition: background 0.2s;
        }

        .tv-score-row:hover {
            background: rgba(255, 106, 0, 0.05);
        }

        .tv-rank {
            font-size: 1.8em;
            font-weight: bold;
            width: 70px;
            text-align: center;
            flex-shrink: 0;
        }

        .tv-player-name {
            font-size: 1.6em;
            flex: 1;
            font-weight: bold;
        }

        .tv-score {
            font-size: 1.8em;
            font-weight: bold;
            color: #ff6a00;
            text-align: right;
            flex-shrink: 0;
        }

        .tv-pb {
            font-size: 0.6em;
            background: linear-gradient(135deg, #ff6a00, #ff9a40);
            color: #fff;
            padding: 3px 10px;
            border-radius: 12px;
            margin-left: 10px;
            animation: pulse 1.5s infinite;
            vertical-align: middle;
        }

        /* TICKER */
        .ticker {
            background: #ff6a00;
            padding: 10px 0;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
        }

        .ticker-content {
            display: inline-block;
            animation: ticker-scroll 30s linear infinite;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 2px;
            padding-left: 100%;
        }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #16213e;
            border: 2px solid #ff6a00;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            position: relative;
        }

        .modal h2 {
            color: #ff6a00;
            margin-bottom: 20px;
            font-size: 1.3em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal .form-group {
            margin-bottom: 15px;
        }

        .modal .form-group label {
            display: block;
            color: #ff6a00;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 10px 15px;
            background: #0f3460;
            border: 1px solid #ff6a00;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
        }

        .modal .form-group select option {
            background: #0f3460;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: none;
            border: none;
            color: #ff6a00;
            font-size: 1.5em;
            cursor: pointer;
        }

        /* ADMIN MODE VISIBILITY */
        .admin-only {
            display: block;
        }

        .tv-mode-active .admin-only {
            display: none;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.5em; }
            .tv-header h1 { font-size: 2em; }
            .tv-player-name { font-size: 1.2em; }
            .tv-score { font-size: 1.4em; }
            .tv-rank { font-size: 1.4em; }
            .main-content { padding: 10px; padding-bottom: 160px; }
            .tv-scores-wrapper { padding: 10px 15px; }
        }
    </style>
</head>
<body>

<!-- ADMIN MODE -->
<div id="adminMode">
    <div class="header">
        <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="Logo" class="logo">
        <h1>Breakdown Leaderboard</h1>
    </div>

    <div class="stats-bar" id="statsBar">
        <div class="stat-card">
            <div class="label">Total Drills</div>
            <div class="value" id="statTotalDrills">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Total Entries</div>
            <div class="value" id="statTotalEntries">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Current Leader</div>
            <div class="value" id="statCurrentLeader">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Best Score</div>
            <div class="value" id="statBestScore">—</div>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tabs" id="drillTabs"></div>
    </div>

    <div class="main-content" id="drillPanels"></div>
</div>

<!-- TV / PRESENTATION MODE -->
<div class="tv-mode" id="tvMode">
    <div class="tv-header">
        <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="Logo" class="logo">
        <h1>Breakdown Leaderboard</h1>
        <div class="tv-drill-name" id="tvDrillName">—</div>
    </div>

    <!-- DRILL NAVIGATION -->
    <div class="tv-drill-nav" id="tvDrillNav">
        <button class="tv-nav-arrow" id="tvPrevBtn" onclick="tvNavigate(-1)">&#8592;</button>
        <div id="tvDrillNavBtns" style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;"></div>
        <button class="tv-nav-arrow" id="tvNextBtn" onclick="tvNavigate(1)">&#8594;</button>
    </div>

    <!-- ROTATION CONTROLS -->
    <div class="tv-rotation-controls">
        <button class="auto-rotate-btn" id="autoRotateBtn" onclick="toggleAutoRotate()">▶ Auto Rotate</button>
        <label>Speed:</label>
        <select id="rotateSpeed" onchange="updateRotateSpeed()">
            <option value="5000">5 sec</option>
            <option value="10000" selected>10 sec</option>
            <option value="15000">15 sec</option>
            <option value="20000">20 sec</option>
            <option value="30000">30 sec</option>
        </select>
        <span class="drill-indicator" id="drillIndicator">Drill 1 of 1</span>
    </div>

    <div class="tv-scores-wrapper">
        <div class="tv-scores-container" id="tvScoresContainer"></div>
    </div>

    <div class="ticker">
        <div class="ticker-content" id="tickerContent">
            🏆 BREAKDOWN LEADERBOARD &nbsp;&nbsp;&nbsp; TRAIN HARD. COMPETE HARDER. &nbsp;&nbsp;&nbsp;
        </div>
    </div>
</div>

<!-- MODE TOGGLE BUTTONS -->
<div class="mode-toggle">
    <button class="mode-btn active" id="adminBtn" onclick="switchMode('admin')">⚙️ Admin</button>
    <button class="mode-btn" id="tvBtn" onclick="switchMode('tv')">📺 TV Mode</button>
</div>

<!-- CREATE DRILL MODAL -->
<div class="modal-overlay" id="createDrillModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal('createDrillModal')">✕</button>
        <h2>➕ Create New Drill</h2>
        <div class="form-group">
            <label>Drill Name</label>
            <input type="text" id="newDrillName" placeholder="e.g. 30s Sprint" oninput="validateDrillForm()">
        </div>
        <div class="form-group">
            <label>Score Type</label>
            <select id="newDrillType" onchange="validateDrillForm()">
                <option value="">-- Select Type --</option>
                <option value="time">Time (lower is better)</option>
                <option value="count">Count (higher is better)</option>
            </select>
        </div>
        <div class="modal-buttons">
            <button class="btn btn-primary" id="createDrillBtn" onclick="createDrill()" disabled>Create Drill</button>
            <button class="btn btn-secondary" onclick="closeModal('createDrillModal')">Cancel</button>
        </div>
    </div>
</div>

<!-- EDIT SCORE MODAL -->
<div class="modal-overlay" id="editScoreModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal('editScoreModal')">✕</button>
        <h2>✏️ Edit Score</h2>
        <div class="form-group">
            <label>Player Name</label>
            <input type="text" id="editPlayerName" placeholder="Player name">
        </div>
        <div class="form-group">
            <label id="editScoreLabel">Score</label>
            <input type="number" id="editScoreValue" placeholder="Score" step="0.01">
        </div>
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="saveEditedScore()">Save Changes</button>
            <button class="btn btn-secondary" onclick="closeModal('editScoreModal')">Cancel</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// FIREBASE CONFIG — Replace with your own Firebase project details
// ============================================================
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

// ============================================================
// DATA STORE (local fallback if Firebase not configured)
// ============================================================
let drills = [
    { id: 'drill_1', name: '30sec Lane Touch', type: 'count' },
    { id: 'drill_2', name: '17s', type: 'time' },
    { id: 'drill_3', name: '2min Round The World', type: 'count' },
    { id: 'drill_4', name: '45 Do Or Die', type: 'time' }
];

let scores = {};
drills.forEach(d => scores[d.id] = []);

let activeDrillId = drills[0].id;
let currentMode = 'admin';
let tvDrillIndex = 0;
let autoRotateInterval = null;
let isAutoRotating = false;
let editingEntry = null;

// ============================================================
// INIT
// ============================================================
function init() {
    loadFromLocalStorage();
    renderAll();
}

function loadFromLocalStorage() {
    try {
        const savedDrills = localStorage.getItem('bb_drills');
        const savedScores = localStorage.getItem('bb_scores');
        if (savedDrills) drills = JSON.parse(savedDrills);
        if (savedScores) scores = JSON.parse(savedScores);
        // Ensure scores object has keys for all drills
        drills.forEach(d => { if (!scores[d.id]) scores[d.id] = []; });
    } catch(e) {
        console.log('LocalStorage load error:', e);
    }
}

function saveToLocalStorage() {
    try {
        localStorage.setItem('bb_drills', JSON.stringify(drills));
        localStorage.setItem('bb_scores', JSON.stringify(scores));
    } catch(e) {
        console.log('LocalStorage save error:', e);
    }
}

function renderAll() {
    renderTabs();
    renderPanels();
    renderStats();
    renderTVMode();
    renderTVDrillNav();
}

// ============================================================
// TABS
// ============================================================
function renderTabs() {
    const tabsEl = document.getElementById('drillTabs');
    tabsEl.innerHTML = '';

    drills.forEach(drill => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (drill.id === activeDrillId ? ' active' : '');
        tab.innerHTML = `
            <span onclick="switchDrill('${drill.id}')">${drill.name}</span>
            <button class="delete-drill" onclick="deleteDrill('${drill.id}')" title="Delete drill">✕</button>
        `;
        tabsEl.appendChild(tab);
    });

    const addTab = document.createElement('div');
    addTab.className = 'add-drill-tab';
    addTab.textContent = '+ New Drill';
    addTab.onclick = () => openModal('createDrillModal');
    tabsEl.appendChild(addTab);
}

function switchDrill(drillId) {
    activeDrillId = drillId;
    renderTabs();
    document.querySelectorAll('.drill-panel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById('panel_' + drillId);
    if (panel) panel.classList.add('active');
    renderStats();
}

// ============================================================
// PANELS
// ============================================================
function renderPanels() {
    const panelsEl = document.getElementById('drillPanels');
    panelsEl.innerHTML = '';

    drills.forEach(drill => {
        const panel = document.createElement('div');
        panel.className = 'drill-panel' + (drill.id === activeDrillId ? ' active' : '');
        panel.id = 'panel_' + drill.id;

        const scoreLabel = drill.type === 'count' ? 'Count (reps)' : 'Time (seconds)';
        const scorePlaceholder = drill.type === 'count' ? 'e.g. 42' : 'e.g. 20.5';

        panel.innerHTML = `
            <div class="add-score-form admin-only">
                <h3>➕ Add Score — ${drill.name}</h3>
                <div class="form-row">
                    <input type="text" id="playerName_${drill.id}" placeholder="Player Name">
                    <input type="number" id="scoreInput_${drill.id}" placeholder="${scorePlaceholder}" step="0.01">
                    <button class="btn btn-primary" onclick="addScore('${drill.id}')">Add Score</button>
                </div>
                <div style="margin-top:8px; font-size:0.8em; color:#888;">
                    📊 Score type: <strong style="color:#ff6a00;">${scoreLabel}</strong>
                    ${drill.type === 'time' ? '— Lower is better ⬇️' : '— Higher is better ⬆️'}
                </div>
            </div>

            <div class="drill-controls admin-only">
                <button class="btn btn-danger" onclick="clearDrillScores('${drill.id}')">🗑️ Clear All Scores</button>
            </div>

            <div class="leaderboard-container">
                <div class="leaderboard-header">
                    <h3>🏆 ${drill.name} — Leaderboard</h3>
                    <span style="font-size:0.85em;">${drill.type === 'count' ? '⬆️ Highest First' : '⬇️ Fastest First'}</span>
                </div>
                <div id="leaderboard_${drill.id}"></div>
            </div>
        `;
        panelsEl.appendChild(panel);
        renderLeaderboard(drill.id);
    });
}

// ============================================================
// LEADERBOARD
// ============================================================
function getSortedScores(drillId) {
    const drill = drills.find(d => d.id === drillId);
    if (!drill || !scores[drillId]) return [];
    const sorted = [...scores[drillId]];
    if (drill.type === 'count') {
        sorted.sort((a, b) => b.score - a.score);
    } else {
        sorted.sort((a, b) => a.score - b.score);
    }
    return sorted.slice(0, 50);
}

function renderLeaderboard(drillId) {
    const drill = drills.find(d => d.id === drillId);
    const container = document.getElementById('leaderboard_' + drillId);
    if (!container || !drill) return;

    const sorted = getSortedScores(drillId);

    if (sorted.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="icon">🏁</div>
                <div>No scores yet. Add the first score!</div>
            </div>`;
        return;
    }

    const scoreColLabel = drill.type === 'count' ? 'Count' : 'Time';

    let html = `
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th>${scoreColLabel}</th>
                    <th>Date</th>
                    <th class="admin-only">Actions</th>
                </tr>
            </thead>
            <tbody>`;

    sorted.forEach((entry, index) => {
        const rank = index + 1;
        let rankClass = rank <= 3 ? `rank-${rank}` : 'rank-other';
        let rankDisplay = rank <= 3 ? ['🥇','🥈','🥉'][rank-1] : rank;
        const scoreClass = drill.type === 'count' ? 'score-count' : 'score-time';
        const scoreDisplay = drill.type === 'time' ? entry.score + 's' : entry.score;
        const pbBadge = entry.isPB ? '<span class="pb-badge">NEW PB! 🔥</span>' : '';
        const dateStr = entry.timestamp ? new Date(entry.timestamp).toLocaleDateString() : '—';
        const timeStr = entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';

        html += `
            <tr>
                <td><span class="rank-badge ${rankClass}">${rankDisplay}</span></td>
                <td>${entry.name}${pbBadge}</td>
                <td><span class="${scoreClass}">${scoreDisplay}</span></td>
                <td><span class="timestamp">${dateStr}<br>${timeStr}</span></td>
                <td class="admin-only">
                    <button class="action-btn edit-btn" onclick="openEditModal('${drillId}', '${entry.id}')">✏️</button>
                    <button class="action-btn delete-btn" onclick="deleteScore('${drillId}', '${entry.id}')">🗑️</button>
                </td>
            </tr>`;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
}

// ============================================================
// ADD SCORE
// ============================================================
function addScore(drillId) {
    const drill = drills.find(d => d.id === drillId);
    const nameEl = document.getElementById('playerName_' + drillId);
    const scoreEl = document.getElementById('scoreInput_' + drillId);

    const name = nameEl.value.trim();
    const score = parseFloat(scoreEl.value);

    if (!name) { alert('Please enter a player name.'); return; }
    if (isNaN(score) || score < 0) { alert('Please enter a valid score.'); return; }

    // Check for personal best
    const existing = scores[drillId].filter(e => e.name.toLowerCase() === name.toLowerCase());
    let isPB = false;
    if (existing.length === 0) {
        isPB = true;
    } else {
        const bestExisting = drill.type === 'count'
            ? Math.max(...existing.map(e => e.score))
            : Math.min(...existing.map(e => e.score));
        isPB = drill.type === 'count' ? score > bestExisting : score < bestExisting;
    }

    const entry = {
        id: 'entry_' + Date.now(),
        name,
        score,
        isPB,
        timestamp: Date.now()
    };

    scores[drillId].push(entry);
    saveToLocalStorage();
    renderLeaderboard(drillId);
    renderStats();
    renderTVMode();
    updateTicker();

    nameEl.value = '';
    scoreEl.value = '';
}

// ============================================================
// DELETE SCORE
// ============================================================
function deleteScore(drillId, entryId) {
    if (!confirm('Delete this score?')) return;
    scores[drillId] = scores[drillId].filter(e => e.id !== entryId);
    saveToLocalStorage();
    renderLeaderboard(drillId);
    renderStats();
    renderTVMode();
}

// ============================================================
// CLEAR DRILL SCORES
// ============================================================
function clearDrillScores(drillId) {
    const drill = drills.find(d => d.id === drillId);
    if (!confirm(`Clear ALL scores for "${drill.name}"?`)) return;
    scores[drillId] = [];
    saveToLocalStorage();
    renderLeaderboard(drillId);
    renderStats();
    renderTVMode();
}

// ============================================================
// DELETE DRILL
// ============================================================
function deleteDrill(drillId) {
    const drill = drills.find(d => d.id === drillId);
    if (!confirm(`Delete drill "${drill.name}" and all its scores?`)) return;
    drills = drills.filter(d => d.id !== drillId);
    delete scores[drillId];
    if (activeDrillId === drillId) {
        activeDrillId = drills.length > 0 ? drills[0].id : null;
    }
    saveToLocalStorage();
    renderAll();
}

// ============================================================
// EDIT SCORE
// ============================================================
function openEditModal(drillId, entryId) {
    const drill = drills.find(d => d.id === drillId);
    const entry = scores[drillId].find(e => e.id === entryId);
    if (!drill || !entry) return;

    editingEntry = { drillId, entryId };
    document.getElementById('editPlayerName').value = entry.name;
    document.getElementById('editScoreValue').value = entry.score;
    document.getElementById('editScoreLabel').textContent =
        drill.type === 'count' ? 'Count (reps)' : 'Time (seconds)';
    openModal('editScoreModal');
}

function saveEditedScore() {
    if (!editingEntry) return;
    const { drillId, entryId } = editingEntry;
    const drill = drills.find(d => d.id === drillId);
    const entryIndex = scores[drillId].findIndex(e => e.id === entryId);
    if (entryIndex === -1) return;

    const newName = document.getElementById('editPlayerName').value.trim();
    const newScore = parseFloat(document.getElementById('editScoreValue').value);

    if (!newName) { alert('Please enter a player name.'); return; }
    if (isNaN(newScore) || newScore < 0) { alert('Please enter a valid score.'); return; }

    // Recalculate PB
    const others = scores[drillId].filter((e, i) => i !== entryIndex && e.name.toLowerCase() === newName.toLowerCase());
    let isPB = false;
    if (others.length === 0) {
        isPB = true;
    } else {
        const bestOther = drill.type === 'count'
            ? Math.max(...others.map(e => e.score))
            : Math.min(...others.map(e => e.score));
        isPB = drill.type === 'count' ? newScore > bestOther : newScore < bestOther;
    }

    scores[drillId][entryIndex] = {
        ...scores[drillId][entryIndex],
        name: newName,
        score: newScore,
        isPB,
        timestamp: Date.now()
    };

    saveToLocalStorage();
    renderLeaderboard(drillId);
    renderStats();
    renderTVMode();
    closeModal('editScoreModal');
    editingEntry = null;
}

// ============================================================
// CREATE DRILL
// ============================================================
function validateDrillForm() {
    const name = document.getElementById('newDrillName').value.trim();
    const type = document.getElementById('newDrillType').value;
    document.getElementById('createDrillBtn').disabled = !(name && type);
}

function createDrill() {
    const name = document.getElementById('newDrillName').value.trim();
    const type = document.getElementById('newDrillType').value;
    if (!name || !type) return;

    const newDrill = {
        id: 'drill_' + Date.now(),
        name,
        type
    };

    drills.push(newDrill);
    scores[newDrill.id] = [];
    activeDrillId = newDrill.id;
    saveToLocalStorage();
    renderAll();
    closeModal('createDrillModal');
    document.getElementById('newDrillName').value = '';
    document.getElementById('newDrillType').value = '';
    document.getElementById('createDrillBtn').disabled = true;
}

// ============================================================
// STATS
// ============================================================
function renderStats() {
    document.getElementById('statTotalDrills').textContent = drills.length;

    let totalEntries = 0;
    drills.forEach(d => { totalEntries += (scores[d.id] || []).length; });
    document.getElementById('statTotalEntries').textContent = totalEntries;

    // Current leader from active drill
    if (activeDrillId && scores[activeDrillId] && scores[activeDrillId].length > 0) {
        const sorted = getSortedScores(activeDrillId);
        const drill = drills.find(d => d.id === activeDrillId);
        document.getElementById('statCurrentLeader').textContent = sorted[0].name;
        document.getElementById('statBestScore').textContent =
            drill.type === 'time' ? sorted[0].score + 's' : sorted[0].score;
    } else {
        document.getElementById('statCurrentLeader').textContent = '—';
        document.getElementById('statBestScore').textContent = '—';
    }
}

// ============================================================
// TV MODE
// ============================================================
function renderTVMode() {
    if (drills.length === 0) return;
    if (tvDrillIndex >= drills.length) tvDrillIndex = 0;
    const drill = drills[tvDrillIndex];
    renderTVDrill(drill);
    updateTicker();
}

function renderTVDrill(drill) {
    document.getElementById('tvDrillName').textContent = drill.name;
    document.getElementById('drillIndicator').textContent =
        `Drill ${tvDrillIndex + 1} of ${drills.length}`;

    const sorted = getSortedScores(drill.id);
    const container = document.getElementById('tvScoresContainer');

    if (sorted.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:60px; color:#888; font-size:1.5em;">
                No scores yet for this drill
            </div>`;
        return;
    }

    let html = '';
    sorted.forEach((entry, index) => {
        const rank = index + 1;
        let rankDisplay = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
        const scoreDisplay = drill.type === 'time' ? entry.score + 's' : entry.score;
        const pbBadge = entry.isPB ? '<span class="tv-pb">🔥 PB</span>' : '';

        html += `
            <div class="tv-score-row">
                <div class="tv-rank">${rankDisplay}</div>
                <div class="tv-player-name">${entry.name}${pbBadge}</div>
                <div class="tv-score">${scoreDisplay}</div>
            </div>`;
    });

    container.innerHTML = html;

    // Update nav buttons active state
    renderTVDrillNav();
}

function renderTVDrillNav() {
    const navBtns = document.getElementById('tvDrillNavBtns');
    if (!navBtns) return;
    navBtns.innerHTML = '';
    drills.forEach((drill, index) => {
        const btn = document.createElement('button');
        btn.className = 'tv-drill-nav-btn' + (index === tvDrillIndex ? ' active' : '');
        btn.textContent = drill.name;
        btn.onclick = () => {
            tvDrillIndex = index;
            renderTVMode();
        };
        navBtns.appendChild(btn);
    });
}

function tvNavigate(direction) {
    tvDrillIndex = (tvDrillIndex + direction + drills.length) % drills.length;
    renderTVMode();
}

// ============================================================
// AUTO ROTATE
// ============================================================
function toggleAutoRotate() {
    isAutoRotating = !isAutoRotating;
    const btn = document.getElementById('autoRotateBtn');
    if (isAutoRotating) {
        btn.textContent = '⏸ Stop Rotation';
        btn.classList.add('active');
        startAutoRotate();
    } else {
        btn.textContent = '▶ Auto Rotate';
        btn.classList.remove('active');
        stopAutoRotate();
    }
}

function startAutoRotate() {
    stopAutoRotate();
    const speed = parseInt(document.getElementById('rotateSpeed').value);
    autoRotateInterval = setInterval(() => {
        tvDrillIndex = (tvDrillIndex + 1) % drills.length;
        renderTVMode();
    }, speed);
}

function stopAutoRotate() {
    if (autoRotateInterval) {
        clearInterval(autoRotateInterval);
        autoRotateInterval = null;
    }
}

function updateRotateSpeed() {
    if (isAutoRotating) {
        startAutoRotate();
    }
}

// ============================================================
// TICKER
// ============================================================
function updateTicker() {
    let tickerText = '🏆 BREAKDOWN LEADERBOARD &nbsp;&nbsp;&nbsp; TRAIN HARD. COMPETE HARDER. &nbsp;&nbsp;&nbsp;';
    drills.forEach(drill => {
        const sorted = getSortedScores(drill.id);
        if (sorted.length > 0) {
            const scoreDisplay = drill.type === 'time' ? sorted[0].score + 's' : sorted[0].score;
            tickerText += `🏅 ${drill.name}: ${sorted[0].name} — ${scoreDisplay} &nbsp;&nbsp;&nbsp; `;
        }
    });
    const tickerEl = document.getElementById('tickerContent');
    if (tickerEl) tickerEl.innerHTML = tickerText;
}

// ============================================================
// MODE SWITCH
// ============================================================
function switchMode(mode) {
    currentMode = mode;
    const adminMode = document.getElementById('adminMode');
    const tvMode = document.getElementById('tvMode');
    const adminBtn = document.getElementById('adminBtn');
    const tvBtn = document.getElementById('tvBtn');

    if (mode === 'tv') {
        adminMode.style.display = 'none';
        tvMode.classList.add('active');
        adminBtn.classList.remove('active');
        tvBtn.classList.add('active');
        renderTVMode();
    } else {
        adminMode.style.display = 'block';
        tvMode.classList.remove('active');
        adminBtn.classList.add('active');
        tvBtn.classList.remove('active');
    }
}

// ============================================================
// MODAL HELPERS
// ============================================================
function openModal(id) {
    document.getElementById(id).classList.add('active');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', function(e) {
        if (e.target === this) closeModal(this.id);
    });
});

// ============================================================
// START
// ============================================================
init();
</script>
</body>
</html>
