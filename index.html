<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakdown Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #0d0d0d 0%, #111111 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff6a00;
        }

        .header img.logo { width: 120px; margin-bottom: 10px; }

        .header h1 {
            font-size: 2.2em;
            color: #ff6a00;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255,106,0,0.5);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px 20px;
            background: #111111;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #ff6a00;
            border-radius: 8px;
            padding: 10px 20px;
            text-align: center;
            min-width: 120px;
        }

        .stat-card .label {
            font-size: 0.7em;
            color: #ff6a00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value { font-size: 1.3em; font-weight: bold; color: #ffffff; }

        .tabs-container { padding: 15px 20px 0; background: #0d0d0d; }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 2px solid #ff6a00;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 16px;
            background: #1a1a1a;
            border: 1px solid #ff6a00;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            color: #ccc;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .tab:hover { background: #ff6a00; color: #fff; }
        .tab.active { background: #ff6a00; color: #fff; font-weight: bold; }

        .tab .delete-drill {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.75em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab .delete-drill:hover { background: rgba(255,0,0,0.6); }

        .add-drill-tab {
            padding: 10px 16px;
            background: transparent;
            border: 1px dashed #ff6a00;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            color: #ff6a00;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .add-drill-tab:hover { background: rgba(255,106,0,0.2); }

        .main-content {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .drill-panel { display: none; }
        .drill-panel.active { display: block; }

        .add-score-form {
            background: #111111;
            border: 1px solid #ff6a00;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .add-score-form h3 {
            color: #ff6a00;
            margin-bottom: 15px;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }

        .form-row input {
            flex: 1;
            min-width: 150px;
            padding: 10px 15px;
            background: #1a1a1a;
            border: 1px solid #ff6a00;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
        }

        .form-row input::placeholder { color: #888; }

        .form-row input:focus {
            outline: none;
            border-color: #ff9a40;
            box-shadow: 0 0 8px rgba(255,106,0,0.4);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary { background: #ff6a00; color: #fff; }
        .btn-primary:hover { background: #ff9a40; transform: translateY(-1px); }
        .btn-danger { background: #c0392b; color: #fff; }
        .btn-danger:hover { background: #e74c3c; }
        .btn-secondary { background: #1a1a1a; color: #fff; border: 1px solid #ff6a00; }
        .btn-secondary:hover { background: #2a2a2a; }

        .leaderboard-container {
            background: #111111;
            border: 1px solid #ff6a00;
            border-radius: 12px;
            overflow: hidden;
        }

        .leaderboard-header {
            background: #ff6a00;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leaderboard-header h3 {
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .leaderboard-table { width: 100%; border-collapse: collapse; }

        .leaderboard-table th {
            background: #1a1a1a;
            padding: 10px 15px;
            text-align: left;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff6a00;
        }

        .leaderboard-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,106,0,0.1);
            font-size: 0.95em;
        }

        .leaderboard-table tr:hover { background: rgba(255,106,0,0.05); }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.85em;
        }

        .rank-1 { background: #FFD700; color: #000; }
        .rank-2 { background: #C0C0C0; color: #000; }
        .rank-3 { background: #CD7F32; color: #fff; }
        .rank-other { background: #1a1a1a; color: #fff; }

        .score-time { color: #4ecdc4; font-weight: bold; }
        .score-count { color: #2ecc71; font-weight: bold; }

        .pb-badge {
            background: linear-gradient(135deg, #ff6a00, #ff9a40);
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: bold;
            margin-left: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timestamp { font-size: 0.75em; color: #888; }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            transition: background 0.2s;
        }

        .edit-btn { color: #4ecdc4; }
        .edit-btn:hover { background: rgba(78,205,196,0.2); }
        .delete-btn { color: #e74c3c; }
        .delete-btn:hover { background: rgba(231,76,60,0.2); }

        .empty-state { text-align: center; padding: 40px; color: #888; }
        .empty-state .icon { font-size: 3em; margin-bottom: 10px; }

        .drill-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

        .sync-status {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            z-index: 9999;
            transition: all 0.3s;
        }

        .sync-status.connected { background: #1a3a1a; border: 1px solid #2ecc71; color: #2ecc71; }
        .sync-status.connecting { background: #3a3a1a; border: 1px solid #f39c12; color: #f39c12; }
        .sync-status.error { background: #3a1a1a; border: 1px solid #e74c3c; color: #e74c3c; }

        /* ── TV MODE ── */
        .tv-mode {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000;
            z-index: 500;
            flex-direction: column;
            overflow: hidden;
        }

        .tv-mode.active { display: flex; }

        .tv-header {
            background: linear-gradient(135deg, #0d0d0d, #111111);
            padding: 20px 40px;
            text-align: center;
            border-bottom: 4px solid #ff6a00;
            flex-shrink: 0;
        }

        .tv-header img.logo { width: 100px; margin-bottom: 8px; }

        .tv-header h1 {
            font-size: 3em;
            color: #ff6a00;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(255,106,0,0.7);
        }

        .tv-drill-name {
            font-size: 1.8em;
            color: #ffffff;
            margin-top: 8px;
            letter-spacing: 3px;
        }

        .tv-drill-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: #111111;
            border-bottom: 2px solid rgba(255,106,0,0.3);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .tv-drill-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #333;
            cursor: pointer;
            transition: background 0.3s;
        }

        .tv-drill-dot.active { background: #ff6a00; }

        .tv-controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 10px 20px;
            background: #0d0d0d;
            border-bottom: 1px solid rgba(255,106,0,0.2);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .tv-controls-bar .btn { font-size: 0.8em; padding: 7px 14px; }

        .tv-scores-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px;
            scrollbar-width: thin;
            scrollbar-color: #ff6a00 #1a1a1a;
        }

        .tv-scores-wrapper::-webkit-scrollbar { width: 6px; }
        .tv-scores-wrapper::-webkit-scrollbar-track { background: #1a1a1a; }
        .tv-scores-wrapper::-webkit-scrollbar-thumb { background: #ff6a00; border-radius: 3px; }

        .tv-scores-grid {
            display: grid;
            gap: 10px;
        }

        .tv-score-row {
            display: grid;
            grid-template-columns: 60px 1fr 160px;
            align-items: center;
            background: #111111;
            border: 1px solid rgba(255,106,0,0.2);
            border-radius: 10px;
            padding: 14px 20px;
            transition: all 0.3s;
        }

        .tv-score-row:hover { border-color: #ff6a00; background: #1a1a1a; }
        .tv-score-row.top-3 { border-color: #ff6a00; background: rgba(255,106,0,0.08); }

        .tv-rank {
            font-size: 1.8em;
            font-weight: bold;
            text-align: center;
        }

        .tv-rank.gold { color: #FFD700; }
        .tv-rank.silver { color: #C0C0C0; }
        .tv-rank.bronze { color: #CD7F32; }
        .tv-rank.normal { color: #555; }

        .tv-player-info { padding: 0 15px; }

        .tv-player-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffffff;
        }

        .tv-player-date { font-size: 0.8em; color: #888; margin-top: 2px; }

        .tv-score-val {
            font-size: 1.8em;
            font-weight: bold;
            text-align: right;
        }

        .tv-score-val.time { color: #4ecdc4; }
        .tv-score-val.count { color: #2ecc71; }

        .tv-ticker {
            background: #ff6a00;
            padding: 8px 0;
            overflow: hidden;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .tv-ticker-inner {
            display: inline-block;
            animation: ticker 30s linear infinite;
            font-size: 1em;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
        }

        @keyframes ticker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* ── MODALS ── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #111111;
            border: 2px solid #ff6a00;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 0 40px rgba(255,106,0,0.3);
        }

        .modal h2 {
            color: #ff6a00;
            margin-bottom: 20px;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal label {
            display: block;
            color: #ccc;
            font-size: 0.85em;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal input, .modal select {
            width: 100%;
            padding: 10px 15px;
            background: #1a1a1a;
            border: 1px solid #ff6a00;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            margin-bottom: 16px;
        }

        .modal input:focus, .modal select:focus {
            outline: none;
            border-color: #ff9a40;
            box-shadow: 0 0 8px rgba(255,106,0,0.4);
        }

        .modal select option { background: #1a1a1a; }

        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .speed-select {
            background: #1a1a1a;
            border: 1px solid #ff6a00;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8em;
        }

        .drill-indicator {
            color: #ff6a00;
            font-size: 0.85em;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- Sync Status -->
<div class="sync-status connecting" id="syncStatus">⟳ Connecting...</div>

<!-- Admin View -->
<div id="adminView">
    <div class="header">
        <img class="logo" src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="BBTF Logo">
        <h1>Breakdown Leaderboard</h1>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="label">Total Entries</div>
            <div class="value" id="statEntries">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Total Drills</div>
            <div class="value" id="statDrills">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Current Leader</div>
            <div class="value" id="statLeader">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Top Score</div>
            <div class="value" id="statBest">—</div>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tabs" id="drillTabs"></div>
    </div>

    <div class="main-content" id="drillPanels"></div>
</div>

<!-- TV Mode -->
<div class="tv-mode" id="tvMode">
    <div class="tv-header">
        <img class="logo" src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="BBTF Logo">
        <h1>Breakdown Leaderboard</h1>
        <div class="tv-drill-name" id="tvDrillName">—</div>
    </div>

    <div class="tv-drill-nav" id="tvDrillNav"></div>

    <div class="tv-controls-bar">
        <button class="btn btn-secondary" onclick="toggleTVMode()">⬅ Admin</button>
        <button class="btn btn-secondary" id="autoRotateBtn" onclick="toggleAutoRotate()">▶ Auto Rotate</button>
        <select class="speed-select" id="rotateSpeed" onchange="updateRotateSpeed()">
            <option value="5000">5s</option>
            <option value="10000" selected>10s</option>
            <option value="15000">15s</option>
            <option value="20000">20s</option>
            <option value="30000">30s</option>
        </select>
        <span class="drill-indicator" id="drillIndicator"></span>
    </div>

    <div class="tv-scores-wrapper">
        <div class="tv-scores-grid" id="tvScoresGrid"></div>
    </div>

    <div class="tv-ticker">
        <span class="tv-ticker-inner" id="tvTicker">BREAKDOWN BASKETBALL TRAINING FACILITY — LIVE LEADERBOARD — COMPETE. IMPROVE. DOMINATE.</span>
    </div>
</div>

<!-- Modal: Add/Edit Score -->
<div class="modal-overlay" id="scoreModal">
    <div class="modal">
        <h2 id="scoreModalTitle">Add Score</h2>
        <label>Player Name</label>
        <input type="text" id="modalPlayerName" placeholder="Enter player name">
        <label id="scoreModalLabel">Score</label>
        <input type="number" id="modalScore" placeholder="e.g. 20.5" step="0.01" min="0">
        <div class="modal-buttons">
            <button class="btn btn-secondary" onclick="closeScoreModal()">Cancel</button>
            <button class="btn btn-primary" id="scoreModalSaveBtn" onclick="saveScoreModal()">Save</button>
        </div>
    </div>
</div>

<!-- Modal: Create Drill -->
<div class="modal-overlay" id="drillModal">
    <div class="modal">
        <h2>Create New Drill</h2>
        <label>Drill Name</label>
        <input type="text" id="newDrillName" placeholder="e.g. 30sec Lane Touch" oninput="validateDrillForm()">
        <label>Scoring Type</label>
        <select id="newDrillType" onchange="validateDrillForm()">
            <option value="">-- Select type --</option>
            <option value="time">Time (lower is better)</option>
            <option value="count">Count (higher is better)</option>
        </select>
        <div class="modal-buttons">
            <button class="btn btn-secondary" onclick="closeDrillModal()">Cancel</button>
            <button class="btn btn-primary" id="createDrillBtn" onclick="createDrill()" disabled>Create Drill</button>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore, collection, doc,
    onSnapshot, setDoc, deleteDoc, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── FIREBASE CONFIG ── replace with your own if needed
const firebaseConfig = {
    apiKey: "AIzaSyExample",
    authDomain: "your-project.firebaseapp.com",
    projectId: "your-project-id",
    storageBucket: "your-project.appspot.com",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:000000000000"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── STATE ──
let drills        = {};   // { drillId: { name, type, entries: [] } }
let activeDrillId = null;
let tvDrillIndex  = 0;
let autoRotate    = false;
let rotateInterval= null;
let rotateSpeed   = 10000;
let editingEntry  = null; // { drillId, entryId }

// ── SYNC STATUS ──
function setSyncStatus(state, text) {
    const el = document.getElementById('syncStatus');
    el.className = 'sync-status ' + state;
    el.textContent = text;
}

// ── REAL-TIME LISTENER ──
// Listens to the entire "drills" collection in real time.
// Every time ANY document changes on ANY device, this fires immediately.
function startRealtimeListener() {
    setSyncStatus('connecting', '⟳ Connecting...');

    onSnapshot(
        collection(db, 'drills'),
        (snapshot) => {
            // Rebuild drills object from Firestore snapshot
            drills = {};
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                drills[docSnap.id] = {
                    name:    data.name    || docSnap.id,
                    type:    data.type    || 'time',
                    entries: data.entries || []
                };
            });

            setSyncStatus('connected', '● Live');
            renderAll();
        },
        (error) => {
            console.error('Firestore listener error:', error);
            setSyncStatus('error', '✕ Error');
        }
    );
}

// ── SAVE DRILL TO FIRESTORE ──
async function saveDrillToFirestore(drillId) {
    try {
        await setDoc(doc(db, 'drills', drillId), drills[drillId]);
    } catch (e) {
        console.error('Save error:', e);
        setSyncStatus('error', '✕ Save Failed');
    }
}

// ── DELETE DRILL FROM FIRESTORE ──
async function deleteDrillFromFirestore(drillId) {
    try {
        await deleteDoc(doc(db, 'drills', drillId));
    } catch (e) {
        console.error('Delete error:', e);
    }
}

// ── RENDER ALL ──
function renderAll() {
    renderTabs();
    renderPanels();
    renderStats();
    if (document.getElementById('tvMode').classList.contains('active')) {
        renderTVMode();
    }
}

// ── RENDER TABS ──
function renderTabs() {
    const tabsEl    = document.getElementById('drillTabs');
    const drillIds  = Object.keys(drills);

    // Keep active drill valid
    if (!activeDrillId || !drills[activeDrillId]) {
        activeDrillId = drillIds[0] || null;
    }

    tabsEl.innerHTML = '';

    drillIds.forEach(id => {
        const drill = drills[id];
        const tab   = document.createElement('div');
        tab.className = 'tab' + (id === activeDrillId ? ' active' : '');
        tab.innerHTML = `
            <span onclick="switchDrill('${id}')">${drill.name}</span>
            <button class="delete-drill" onclick="deleteDrill('${id}')" title="Delete drill">✕</button>
        `;
        tabsEl.appendChild(tab);
    });

    // Add drill button
    const addTab = document.createElement('div');
    addTab.className = 'add-drill-tab';
    addTab.textContent = '+ New Drill';
    addTab.onclick = openDrillModal;
    tabsEl.appendChild(addTab);
}

// ── RENDER PANELS ──
function renderPanels() {
    const panelsEl = document.getElementById('drillPanels');
    panelsEl.innerHTML = '';

    Object.keys(drills).forEach(id => {
        const drill  = drills[id];
        const sorted = getSortedEntries(drill);
        const panel  = document.createElement('div');
        panel.className = 'drill-panel' + (id === activeDrillId ? ' active' : '');
        panel.id = 'panel-' + id;

        const scoreLabel = drill.type === 'count' ? 'Count' : 'Time (secs)';
        const scorePlaceholder = drill.type === 'count' ? 'e.g. 42' : 'e.g. 20.5';

        panel.innerHTML = `
            <div class="add-score-form">
                <h3>➕ Add Score — ${drill.name}</h3>
                <div class="form-row">
                    <input type="text"   id="pName-${id}" placeholder="Player name">
                    <input type="number" id="pScore-${id}" placeholder="${scorePlaceholder}" step="0.01" min="0">
                    <button class="btn btn-primary" onclick="addScore('${id}')">Add</button>
                </div>
            </div>

            <div class="drill-controls">
                <button class="btn btn-danger" onclick="clearDrill('${id}')">🗑 Clear All Scores</button>
            </div>

            <div class="leaderboard-container">
                <div class="leaderboard-header">
                    <h3>🏆 ${drill.name} — Leaderboard</h3>
                    <span style="font-size:0.85em">${sorted.length} / 50 entries</span>
                </div>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Player</th>
                            <th>${scoreLabel}</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-${id}">
                        ${sorted.length === 0
                            ? `<tr><td colspan="5">
                                    <div class="empty-state">
                                        <div class="icon">🏀</div>
                                        <div>No scores yet. Add the first one!</div>
                                    </div>
                               </td></tr>`
                            : sorted.map((entry, idx) => buildAdminRow(entry, idx, drill.type, id)).join('')
                        }
                    </tbody>
                </table>
            </div>
        `;
        panelsEl.appendChild(panel);
    });

    if (Object.keys(drills).length === 0) {
        panelsEl.innerHTML = `
            <div class="empty-state" style="margin-top:40px">
                <div class="icon">📋</div>
                <div>No drills yet. Click <strong>+ New Drill</strong> to get started.</div>
            </div>`;
    }
}

function buildAdminRow(entry, idx, type, drillId) {
    const rank  = idx + 1;
    const badge = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
    const scoreClass = type === 'count' ? 'score-count' : 'score-time';
    const scoreDisplay = type === 'count' ? entry.score : entry.score + 's';
    const pbBadge = entry.isPB ? '<span class="pb-badge">NEW PB 🔥</span>' : '';
    const dateStr = entry.timestamp ? new Date(entry.timestamp).toLocaleDateString('en-AU') : '—';

    return `
        <tr>
            <td><span class="rank-badge ${badge}">${rank}</span></td>
            <td>${entry.player}${pbBadge}</td>
            <td><span class="${scoreClass}">${scoreDisplay}</span></td>
            <td><span class="timestamp">${dateStr}</span></td>
            <td>
                <button class="action-btn edit-btn"   onclick="openEditModal('${drillId}','${entry.id}')">✏️</button>
                <button class="action-btn delete-btn" onclick="deleteEntry('${drillId}','${entry.id}')">🗑</button>
            </td>
        </tr>`;
}

// ── RENDER STATS ──
function renderStats() {
    const allEntries = Object.values(drills).flatMap(d => d.entries);
    document.getElementById('statEntries').textContent = allEntries.length;
    document.getElementById('statDrills').textContent  = Object.keys(drills).length;

    if (activeDrillId && drills[activeDrillId]) {
        const drill  = drills[activeDrillId];
        const sorted = getSortedEntries(drill);
        if (sorted.length > 0) {
            document.getElementById('statLeader').textContent = sorted[0].player;
            document.getElementById('statBest').textContent   =
                drill.type === 'count' ? sorted[0].score : sorted[0].score + 's';
        } else {
            document.getElementById('statLeader').textContent = '—';
            document.getElementById('statBest').textContent   = '—';
        }
    }
}

// ── SORT ENTRIES ──
function getSortedEntries(drill) {
    const entries = [...(drill.entries || [])];
    if (drill.type === 'count') {
        entries.sort((a, b) => b.score - a.score);
    } else {
        entries.sort((a, b) => a.score - b.score);
    }
    return entries.slice(0, 50);
}

// ── ADD SCORE ──
window.addScore = function(drillId) {
    const nameEl  = document.getElementById('pName-'  + drillId);
    const scoreEl = document.getElementById('pScore-' + drillId);
    const name    = nameEl.value.trim();
    const score   = parseFloat(scoreEl.value);

    if (!name)        { alert('Please enter a player name.'); return; }
    if (isNaN(score) || score < 0) { alert('Please enter a valid score.'); return; }

    const drill     = drills[drillId];
    const existing  = drill.entries.filter(e => e.player.toLowerCase() === name.toLowerCase());
    let isPB        = false;

    if (existing.length === 0) {
        isPB = true;
    } else {
        const best = drill.type === 'count'
            ? Math.max(...existing.map(e => e.score))
            : Math.min(...existing.map(e => e.score));
        isPB = drill.type === 'count' ? score > best : score < best;
    }

    const entry = {
        id:        Date.now().toString(),
        player:    name,
        score:     score,
        isPB:      isPB,
        timestamp: Date.now()
    };

    drill.entries.push(entry);

    // Cap at 50 per drill (keep best 50)
    drill.entries = getSortedEntries(drill).slice(0, 50)
        .map(e => drill.entries.find(x => x.id === e.id))
        .filter(Boolean);

    saveDrillToFirestore(drillId);

    nameEl.value  = '';
    scoreEl.value = '';
};

// ── DELETE ENTRY ──
window.deleteEntry = function(drillId, entryId) {
    if (!confirm('Delete this entry?')) return;
    drills[drillId].entries = drills[drillId].entries.filter(e => e.id !== entryId);
    saveDrillToFirestore(drillId);
};

// ── CLEAR DRILL ──
window.clearDrill = function(drillId) {
    if (!confirm('Clear ALL scores for this drill?')) return;
    drills[drillId].entries = [];
    saveDrillToFirestore(drillId);
};

// ── DELETE DRILL ──
window.deleteDrill = function(drillId) {
    if (!confirm(`Delete the drill "${drills[drillId].name}" and all its scores?`)) return;
    delete drills[drillId];
    if (activeDrillId === drillId) activeDrillId = Object.keys(drills)[0] || null;
    deleteDrillFromFirestore(drillId);
};

// ── SWITCH DRILL ──
window.switchDrill = function(drillId) {
    activeDrillId = drillId;
    renderAll();
};

// ── EDIT MODAL ──
window.openEditModal = function(drillId, entryId) {
    const drill = drills[drillId];
    const entry = drill.entries.find(e => e.id === entryId);
    if (!entry) return;

    editingEntry = { drillId, entryId };

    document.getElementById('scoreModalTitle').textContent =
        drill.type === 'count' ? 'Edit Count Score' : 'Edit Time Score';
    document.getElementById('scoreModalLabel').textContent =
        drill.type === 'count' ? 'Count' : 'Time (secs)';
    document.getElementById('modalPlayerName').value = entry.player;
    document.getElementById('modalScore').value      = entry.score;

    document.getElementById('scoreModal').classList.add('active');
};

window.closeScoreModal = function() {
    editingEntry = null;
    document.getElementById('scoreModal').classList.remove('active');
};

window.saveScoreModal = function() {
    if (!editingEntry) return;
    const { drillId, entryId } = editingEntry;
    const drill = drills[drillId];
    const entry = drill.entries.find(e => e.id === entryId);
    if (!entry) return;

    const newName  = document.getElementById('modalPlayerName').value.trim();
    const newScore = parseFloat(document.getElementById('modalScore').value);

    if (!newName)              { alert('Please enter a player name.'); return; }
    if (isNaN(newScore) || newScore < 0) { alert('Please enter a valid score.'); return; }

    entry.player    = newName;
    entry.score     = newScore;
    entry.timestamp = Date.now();

    // Recalculate PB for this player
    const playerEntries = drill.entries.filter(e => e.player.toLowerCase() === newName.toLowerCase());
    const best = drill.type === 'count'
        ? Math.max(...playerEntries.map(e => e.score))
        : Math.min(...playerEntries.map(e => e.score));

    playerEntries.forEach(e => { e.isPB = e.score === best; });

    saveDrillToFirestore(drillId);
    closeScoreModal();
};

// ── CREATE DRILL MODAL ──
window.openDrillModal  = function() { document.getElementById('drillModal').classList.add('active'); };
window.closeDrillModal = function() {
    document.getElementById('drillModal').classList.remove('active');
    document.getElementById('newDrillName').value = '';
    document.getElementById('newDrillType').value = '';
    document.getElementById('createDrillBtn').disabled = true;
};

window.validateDrillForm = function() {
    const name = document.getElementById('newDrillName').value.trim();
    const type = document.getElementById('newDrillType').value;
    document.getElementById('createDrillBtn').disabled = !(name && type);
};

window.createDrill = function() {
    const name = document.getElementById('newDrillName').value.trim();
    const type = document.getElementById('newDrillType').value;
    if (!name || !type) return;

    const id = 'drill_' + Date.now();
    drills[id] = { name, type, entries: [] };
    activeDrillId = id;

    saveDrillToFirestore(id);
    closeDrillModal();
};

// ── TV MODE ──
window.toggleTVMode = function() {
    const tv = document.getElementById('tvMode');
    tv.classList.toggle('active');
    if (tv.classList.contains('active')) {
        tvDrillIndex = Object.keys(drills).indexOf(activeDrillId);
        if (tvDrillIndex < 0) tvDrillIndex = 0;
        renderTVMode();
    }
};

function renderTVMode() {
    const drillIds = Object.keys(drills);
    if (drillIds.length === 0) return;

    if (tvDrillIndex >= drillIds.length) tvDrillIndex = 0;
    const drillId = drillIds[tvDrillIndex];
    const drill   = drills[drillId];
    const sorted  = getSortedEntries(drill);

    // Header drill name
    document.getElementById('tvDrillName').textContent = drill.name;

    // Dot nav
    const navEl = document.getElementById('tvDrillNav');
    navEl.innerHTML = '';
    drillIds.forEach((id, idx) => {
        const dot = document.createElement('div');
        dot.className = 'tv-drill-dot' + (idx === tvDrillIndex ? ' active' : '');
        dot.onclick   = () => { tvDrillIndex = idx; renderTVMode(); };
        navEl.appendChild(dot);
    });

    // Drill indicator
    document.getElementById('drillIndicator').textContent =
        `${tvDrillIndex + 1} / ${drillIds.length} — ${drill.name}`;

    // Scores
    const grid = document.getElementById('tvScoresGrid');
    grid.innerHTML = '';

    if (sorted.length === 0) {
        grid.innerHTML = '<div class="empty-state"><div class="icon">🏀</div><div>No scores yet</div></div>';
        return;
    }

    sorted.forEach((entry, idx) => {
        const rank = idx + 1;
        const rankClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : 'normal';
        const rankSymbol = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        const scoreClass = drill.type === 'count' ? 'count' : 'time';
        const scoreDisplay = drill.type === 'count' ? entry.score : entry.score + 's';
        const dateStr = entry.timestamp ? new Date(entry.timestamp).toLocaleDateString('en-AU') : '';

        const row = document.createElement('div');
        row.className = 'tv-score-row' + (rank <= 3 ? ' top-3' : '');
        row.innerHTML = `
            <div class="tv-rank ${rankClass}">${rankSymbol}</div>
            <div class="tv-player-info">
                <div class="tv-player-name">${entry.player}</div>
                <div class="tv-player-date">${dateStr}</div>
            </div>
            <div class="tv-score-val ${scoreClass}">${scoreDisplay}</div>
        `;
        grid.appendChild(row);
    });

    // Ticker
    buildTicker();
}

function buildTicker() {
    const drillIds = Object.keys(drills);
    if (drillIds.length === 0) return;
    const parts = drillIds.map(id => {
        const drill  = drills[id];
        const sorted = getSortedEntries(drill);
        if (sorted.length === 0) return `${drill.name}: No scores yet`;
        const leader = sorted[0];
        const score  = drill.type === 'count' ? leader.score : leader.score + 's';
        return `${drill.name}: 🏆 ${leader.player} — ${score}`;
    });
    document.getElementById('tvTicker').textContent =
        parts.join('   ★   ') + '   ★   BREAKDOWN BASKETBALL TRAINING FACILITY';
}

// ── AUTO ROTATE ──
window.toggleAutoRotate = function() {
    autoRotate = !autoRotate;
    const btn  = document.getElementById('autoRotateBtn');
    if (autoRotate) {
        btn.textContent = '⏸ Pause Rotate';
        btn.classList.replace('btn-secondary', 'btn-primary');
        startRotation();
    } else {
        btn.textContent = '▶ Auto Rotate';
        btn.classList.replace('btn-primary', 'btn-secondary');
        stopRotation();
    }
};

window.updateRotateSpeed = function() {
    rotateSpeed = parseInt(document.getElementById('rotateSpeed').value);
    if (autoRotate) { stopRotation(); startRotation(); }
};

function startRotation() {
    rotateInterval = setInterval(() => {
        const len = Object.keys(drills).length;
        if (len === 0) return;
        tvDrillIndex = (tvDrillIndex + 1) % len;
        renderTVMode();
    }, rotateSpeed);
}

function stopRotation() {
    clearInterval(rotateInterval);
    rotateInterval = null;
}

// ── TV TOGGLE BUTTON (in admin view) ──
// We add a floating TV button to admin view
function injectTVButton() {
    const btn = document.createElement('button');
    btn.className   = 'btn btn-primary';
    btn.textContent = '📺 TV Mode';
    btn.onclick     = toggleTVMode;
    btn.style.cssText = `
        position: fixed;
        bottom: 30px;
        right: 20px;
        z-index: 400;
        box-shadow: 0 4px 15px rgba(255,106,0,0.4);
    `;
    document.body.appendChild(btn);
}

// ── BOOT ──
injectTVButton();
startRealtimeListener();

</script>
</body>
