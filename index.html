<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakdown Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff6a00;
        }

        .header img {
            height: 80px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2em;
            color: #ff6a00;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .tabs-container {
            background: #1a1a1a;
            padding: 15px 20px 0;
            border-bottom: 2px solid #333;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .tab-btn {
            background: #2d2d2d;
            color: #aaa;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover { background: #3d3d3d; color: #fff; }

        .tab-btn.active {
            background: #ff6a00;
            color: #fff;
            border-color: #ff6a00;
        }

        .tab-delete {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 0.9em;
            padding: 0 2px;
            line-height: 1;
        }

        .add-drill-tab {
            background: #1a3a1a;
            color: #4CAF50;
            border: 1px dashed #4CAF50;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .add-drill-tab:hover { background: #2a4a2a; }

        .main-content {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 120px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 0.7em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 1.3em;
            font-weight: bold;
            color: #ff6a00;
            margin-top: 4px;
        }

        .form-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-section h3 {
            color: #ff6a00;
            margin-bottom: 15px;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-row input, .form-row select {
            flex: 1;
            min-width: 150px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95em;
        }

        .form-row input:focus, .form-row select:focus {
            outline: none;
            border-color: #ff6a00;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-orange { background: #ff6a00; color: #fff; }
        .btn-orange:hover { background: #e55a00; }
        .btn-red { background: #c0392b; color: #fff; }
        .btn-red:hover { background: #a93226; }
        .btn-green { background: #27ae60; color: #fff; }
        .btn-green:hover { background: #229954; }

        .leaderboard {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .leaderboard-header {
            background: #ff6a00;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leaderboard-header h3 {
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            background: #2d2d2d;
            padding: 10px 16px;
            text-align: left;
            font-size: 0.8em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tbody tr {
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }

        tbody tr:hover { background: #222; }

        tbody td { padding: 12px 16px; font-size: 0.95em; }

        .rank-1 { color: #FFD700; font-weight: bold; }
        .rank-2 { color: #C0C0C0; font-weight: bold; }
        .rank-3 { color: #CD7F32; font-weight: bold; }

        .score-time { color: #4fc3f7; font-weight: bold; }
        .score-count { color: #81c784; font-weight: bold; }

        .pb-badge {
            background: #ff6a00;
            color: white;
            font-size: 0.65em;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            white-space: nowrap;
        }

        .delete-entry-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 0.9em;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .delete-entry-btn:hover { color: #ff4444; background: #2d2d2d; }

        .edit-entry-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 0.9em;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .edit-entry-btn:hover { color: #ff6a00; background: #2d2d2d; }

        .timestamp { font-size: 0.75em; color: #555; }

        .empty-state { text-align: center; padding: 40px; color: #555; }
        .empty-state .icon { font-size: 2em; margin-bottom: 10px; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #1a1a1a;
            border: 2px solid #ff6a00;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 420px;
            position: relative;
            z-index: 10000;
        }

        .modal h2 {
            color: #ff6a00;
            margin-bottom: 20px;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal input, .modal select {
            width: 100%;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 1em;
            margin-bottom: 15px;
            display: block;
        }

        .modal input:focus, .modal select:focus {
            outline: none;
            border-color: #ff6a00;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .modal-confirm { background: #ff6a00; color: white; }
        .modal-confirm:hover { background: #e55a00; }
        .modal-confirm:disabled { background: #555; color: #888; cursor: not-allowed; }
        .modal-cancel { background: #333; color: #aaa; }
        .modal-cancel:hover { background: #444; color: #fff; }

        /* MODE TOGGLE - moved up to avoid covering ticker */
        .mode-toggle {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
            background: #1a1a1a;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .mode-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mode-btn.active { background: #ff6a00; color: white; }
        .mode-btn:not(.active) { background: #2d2d2d; color: #888; }
        .mode-btn:not(.active):hover { background: #3d3d3d; color: #fff; }

        /* TV / PRESENTATION MODE */
        .tv-mode {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a0a;
            z-index: 500;
            flex-direction: column;
            overflow: hidden;
        }

        .tv-mode.active { display: flex; }

        .tv-header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 4px solid #ff6a00;
            gap: 20px;
            flex-shrink: 0;
        }

        .tv-header img { height: 70px; }

        .tv-header h1 {
            font-size: 2.5em;
            color: #ff6a00;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .tv-drill-name {
            text-align: center;
            font-size: 1.8em;
            color: #ffffff;
            padding: 16px;
            background: #1a1a1a;
            border-bottom: 2px solid #333;
            letter-spacing: 2px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* ROTATION CONTROLS */
        .tv-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
            background: #111;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .tv-controls button {
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .tv-prev-btn, .tv-next-btn {
            background: #2d2d2d;
            color: #fff;
        }

        .tv-prev-btn:hover, .tv-next-btn:hover { background: #ff6a00; }

        .tv-auto-btn {
            background: #1a3a1a;
            color: #4CAF50;
            border: 1px solid #4CAF50 !important;
            border: none;
        }

        .tv-auto-btn.running {
            background: #3a1a1a;
            color: #ff4444;
            border: 1px solid #ff4444 !important;
        }

        .tv-drill-indicator {
            color: #888;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        .tv-scores-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 40px 20px;
            scrollbar-width: thin;
            scrollbar-color: #ff6a00 #1a1a1a;
        }

        .tv-scores-container::-webkit-scrollbar { width: 8px; }
        .tv-scores-container::-webkit-scrollbar-track { background: #1a1a1a; }
        .tv-scores-container::-webkit-scrollbar-thumb { background: #ff6a00; border-radius: 4px; }

        .tv-table {
            width: 100%;
            border-collapse: collapse;
        }

        .tv-table thead th {
            background: #2d2d2d;
            padding: 14px 20px;
            text-align: left;
            font-size: 1em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: sticky;
            top: 0;
        }

        .tv-table tbody tr {
            border-bottom: 1px solid #1f1f1f;
            transition: background 0.2s;
        }

        .tv-table tbody tr:nth-child(even) { background: #111; }

        .tv-table tbody td {
            padding: 16px 20px;
            font-size: 1.3em;
        }

        .tv-rank-1 { color: #FFD700; font-weight: bold; font-size: 1.5em; }
        .tv-rank-2 { color: #C0C0C0; font-weight: bold; }
        .tv-rank-3 { color: #CD7F32; font-weight: bold; }

        .tv-score-time { color: #4fc3f7; font-weight: bold; }
        .tv-score-count { color: #81c784; font-weight: bold; }

        /* TICKER */
        .tv-ticker {
            background: #ff6a00;
            color: white;
            padding: 10px 0;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tv-ticker-inner {
            display: inline-block;
            animation: ticker 30s linear infinite;
            font-size: 1em;
            font-weight: bold;
            letter-spacing: 2px;
        }

        @keyframes ticker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

<!-- ADMIN MODE -->
<div id="adminMode">
    <div class="header">
        <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="Logo">
        <h1>Breakdown Leaderboard</h1>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>

    <div class="main-content">
        <div class="stats-bar" id="statsBar"></div>

        <div class="form-section">
            <h3>➕ Add Score</h3>
            <div class="form-row">
                <input type="text" id="playerName" placeholder="Player name..." />
                <input type="number" id="playerScore" placeholder="Enter score..." step="0.01" min="0" />
                <button class="btn btn-orange" onclick="addEntry()">Add</button>
            </div>
            <div style="margin-top:8px; font-size:0.8em; color:#666;" id="scoreHint"></div>
        </div>

        <div class="leaderboard">
            <div class="leaderboard-header">
                <h3 id="leaderboardTitle">Leaderboard</h3>
                <button class="btn btn-red" style="font-size:0.75em; padding:6px 12px;" onclick="clearDrill()">Clear All</button>
            </div>
            <div id="leaderboardBody"></div>
        </div>
    </div>
</div>

<!-- TV / PRESENTATION MODE -->
<div class="tv-mode" id="tvMode">
    <div class="tv-header">
        <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="Logo">
        <h1>Breakdown Leaderboard</h1>
    </div>

    <div class="tv-drill-name" id="tvDrillName">Select a Drill</div>

    <!-- ROTATION CONTROLS -->
    <div class="tv-controls">
        <button class="tv-prev-btn" onclick="tvPrevDrill()">◀ Prev</button>
        <span class="tv-drill-indicator" id="tvDrillIndicator">Drill 1 of 1</span>
        <button class="tv-next-btn" onclick="tvNextDrill()">Next ▶</button>
        <button class="tv-auto-btn" id="tvAutoBtn" onclick="toggleTvAutoRotate()">▶ Auto Rotate</button>
    </div>

    <div class="tv-scores-container" id="tvScoresContainer">
        <table class="tv-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th id="tvScoreHeader">Score</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="tvScoresBody"></tbody>
        </table>
    </div>

    <div class="tv-ticker">
        <span class="tv-ticker-inner" id="tvTicker">BREAKDOWN BASKETBALL — LIVE LEADERBOARD</span>
    </div>
</div>

<!-- MODE TOGGLE -->
<div class="mode-toggle">
    <button class="mode-btn active" id="adminModeBtn" onclick="switchMode('admin')">⚙️ Admin</button>
    <button class="mode-btn" id="tvModeBtn" onclick="switchMode('tv')">📺 TV Mode</button>
</div>

<!-- MODAL: Add Drill -->
<div class="modal-overlay" id="addDrillModal">
    <div class="modal">
        <h2>➕ New Drill</h2>
        <input type="text" id="newDrillName" placeholder="Drill name..." oninput="validateDrillForm()" />
        <select id="newDrillType" onchange="validateDrillForm()">
            <option value="">-- Select scoring type --</option>
            <option value="time">Time (lower is better)</option>
            <option value="count">Count (higher is better)</option>
        </select>
        <div class="modal-buttons">
            <button class="modal-cancel" onclick="closeAddDrillModal()">Cancel</button>
            <button class="modal-confirm" id="createDrillBtn" onclick="createDrill()" disabled>Create Drill</button>
        </div>
    </div>
</div>

<!-- MODAL: Edit Entry -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2>✏️ Edit Score</h2>
        <input type="text" id="editPlayerName" placeholder="Player name..." />
        <input type="number" id="editPlayerScore" placeholder="Score..." step="0.01" min="0" />
        <div class="modal-buttons">
            <button class="modal-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="modal-confirm" onclick="saveEdit()">Save</button>
        </div>
    </div>
</div>

<script>
    // ── DATA ──────────────────────────────────────────────────────────────────
    let drills = JSON.parse(localStorage.getItem('bbDrills')) || [
        { id: 'drill1', name: '30sec Lane Touch', type: 'count', entries: [] },
        { id: 'drill2', name: '17s Drill', type: 'time', entries: [] },
        { id: 'drill3', name: '2min Round The World', type: 'time', entries: [] },
        { id: 'drill4', name: '45 Do or Die', type: 'time', entries: [] }
    ];

    let currentDrillId = drills[0]?.id || null;
    let editingEntryId = null;

    // TV rotation state
    let tvDrillIndex = 0;
    let tvAutoRotate = false;
    let tvAutoInterval = null;

    // ── PERSISTENCE ───────────────────────────────────────────────────────────
    function saveData() {
        localStorage.setItem('bbDrills', JSON.stringify(drills));
    }

    // ── HELPERS ───────────────────────────────────────────────────────────────
    function getCurrentDrill() {
        return drills.find(d => d.id === currentDrillId);
    }

    function formatScore(score, type) {
        if (type === 'time') return parseFloat(score).toFixed(2) + 's';
        return parseInt(score);
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function formatDateTime(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) +
               ' ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    }

    function getSortedEntries(drill) {
        const sorted = [...drill.entries];
        if (drill.type === 'count') sorted.sort((a,b) => b.score - a.score);
        else sorted.sort((a,b) => a.score - b.score);
        return sorted.slice(0, 50);
    }

    // ── TABS ──────────────────────────────────────────────────────────────────
    function renderTabs() {
        const container = document.getElementById('tabsContainer');
        container.innerHTML = '';
        drills.forEach(drill => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn' + (drill.id === currentDrillId ? ' active' : '');
            btn.innerHTML = `<span onclick="switchDrill('${drill.id}')">${drill.name}</span>
                <button class="tab-delete" onclick="deleteDrill('${drill.id}')" title="Delete drill">✕</button>`;
            container.appendChild(btn);
        });
        const addBtn = document.createElement('button');
        addBtn.className = 'add-drill-tab';
        addBtn.textContent = '+ New Drill';
        addBtn.onclick = openAddDrillModal;
        container.appendChild(addBtn);
    }

    function switchDrill(id) {
        currentDrillId = id;
        renderTabs();
        renderLeaderboard();
        renderStats();
        updateScoreHint();
    }

    // ── STATS ─────────────────────────────────────────────────────────────────
    function renderStats() {
        const drill = getCurrentDrill();
        const statsBar = document.getElementById('statsBar');
        if (!drill) { statsBar.innerHTML = ''; return; }
        const sorted = getSortedEntries(drill);
        const leader = sorted[0];
        statsBar.innerHTML = `
            <div class="stat-card">
                <div class="label">Entries</div>
                <div class="value">${drill.entries.length}</div>
            </div>
            <div class="stat-card">
                <div class="label">Leader</div>
                <div class="value">${leader ? leader.name : '—'}</div>
            </div>
            <div class="stat-card">
                <div class="label">Best Score</div>
                <div class="value">${leader ? formatScore(leader.score, drill.type) : '—'}</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Drills</div>
                <div class="value">${drills.length}</div>
            </div>`;
    }

    // ── SCORE HINT ────────────────────────────────────────────────────────────
    function updateScoreHint() {
        const drill = getCurrentDrill();
        const hint = document.getElementById('scoreHint');
        const input = document.getElementById('playerScore');
        if (!drill) return;
        if (drill.type === 'time') {
            hint.textContent = '⏱ Enter time in seconds (e.g. 20.45) — lower is better';
            input.placeholder = 'Time (seconds)...';
        } else {
            hint.textContent = '🔢 Enter count/reps — higher is better';
            input.placeholder = 'Count / Reps...';
        }
    }

    // ── ADD ENTRY ─────────────────────────────────────────────────────────────
    function addEntry() {
        const drill = getCurrentDrill();
        if (!drill) return;
        const name = document.getElementById('playerName').value.trim();
        const score = parseFloat(document.getElementById('playerScore').value);
        if (!name || isNaN(score) || score < 0) {
            alert('Please enter a valid name and score.');
            return;
        }

        // Check if this is a PB for this player
        const playerEntries = drill.entries.filter(e => e.name.toLowerCase() === name.toLowerCase());
        let isPB = false;
        if (playerEntries.length === 0) {
            isPB = true;
        } else {
            const best = drill
