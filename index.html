<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakdown Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #0d0d0d 0%, #111111 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff6a00;
        }

        .header img.logo { width: 120px; margin-bottom: 10px; }

        .header h1 {
            font-size: 2.2em;
            color: #ff6a00;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255,106,0,0.5);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px 20px;
            background: #111111;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #ff6a00;
            border-radius: 8px;
            padding: 10px 20px;
            text-align: center;
            min-width: 120px;
        }

        .stat-card .label {
            font-size: 0.7em;
            color: #ff6a00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value { font-size: 1.3em; font-weight: bold; color: #ffffff; }

        .tabs-container { padding: 15px 20px 0; background: #0d0d0d; }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 2px solid #ff6a00;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 16px;
            background: #1a1a1a;
            border: 1px solid #ff6a00;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            color: #ccc;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .tab:hover { background: #ff6a00; color: #fff; }
        .tab.active { background: #ff6a00; color: #fff; font-weight: bold; }

        .tab .delete-drill {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.75em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab .delete-drill:hover { background: rgba(255,0,0,0.6); }

        .add-drill-tab {
            padding: 10px 16px;
            background: transparent;
            border: 1px dashed #ff6a00;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            color: #ff6a00;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .add-drill-tab:hover { background: rgba(255,106,0,0.2); }

        .main-content {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .drill-panel { display: none; }
        .drill-panel.active { display: block; }

        .add-score-form {
            background: #111111;
            border: 1px solid #ff6a00;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .add-score-form h3 {
            color: #ff6a00;
            margin-bottom: 15px;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }

        .form-row input {
            flex: 1;
            min-width: 150px;
            padding: 10px 15px;
            background: #1a1a1a;
            border: 1px solid #ff6a00;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
        }

        .form-row input::placeholder { color: #888; }

        .form-row input:focus {
            outline: none;
            border-color: #ff9a40;
            box-shadow: 0 0 8px rgba(255,106,0,0.4);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary { background: #ff6a00; color: #fff; }
        .btn-primary:hover { background: #ff9a40; transform: translateY(-1px); }
        .btn-danger { background: #c0392b; color: #fff; }
        .btn-danger:hover { background: #e74c3c; }
        .btn-secondary { background: #1a1a1a; color: #fff; border: 1px solid #ff6a00; }
        .btn-secondary:hover { background: #2a2a2a; }

        .leaderboard-container {
            background: #111111;
            border: 1px solid #ff6a00;
            border-radius: 12px;
            overflow: hidden;
        }

        .leaderboard-header {
            background: #ff6a00;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leaderboard-header h3 {
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .leaderboard-table { width: 100%; border-collapse: collapse; }

        .leaderboard-table th {
            background: #1a1a1a;
            padding: 10px 15px;
            text-align: left;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff6a00;
        }

        .leaderboard-table td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,106,0,0.1);
            font-size: 0.95em;
        }

        .leaderboard-table tr:hover { background: rgba(255,106,0,0.05); }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.85em;
        }

        .rank-1 { background: #FFD700; color: #000; }
        .rank-2 { background: #C0C0C0; color: #000; }
        .rank-3 { background: #CD7F32; color: #fff; }
        .rank-other { background: #1a1a1a; color: #fff; }

        .score-time { color: #4ecdc4; font-weight: bold; }
        .score-count { color: #2ecc71; font-weight: bold; }

        .pb-badge {
            background: linear-gradient(135deg, #ff6a00, #ff9a40);
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: bold;
            margin-left: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timestamp { font-size: 0.75em; color: #888; }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            transition: background 0.2s;
        }

        .edit-btn { color: #4ecdc4; }
        .edit-btn:hover { background: rgba(78,205,196,0.2); }
        .delete-btn { color: #e74c3c; }
        .delete-btn:hover { background: rgba(231,76,60,0.2); }

        .empty-state { text-align: center; padding: 40px; color: #888; }
        .empty-state .icon { font-size: 3em; margin-bottom: 10px; }

        .drill-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

        /* ── SYNC STATUS ── */
        .sync-status {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            z-index: 9999;
            transition: all 0.3s;
        }

        .sync-status.connected { background: #1a3a1a; border: 1px solid #2ecc71; color: #2ecc71; }
        .sync-status.connecting { background: #3a3a1a; border: 1px solid #f39c12; color: #f39c12; }
        .sync-status.error { background: #3a1a1a; border: 1px solid #e74c3c; color: #e74c3c; }

        /* ── TV MODE ── */
        .tv-mode {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000;
            z-index: 500;
            flex-direction: column;
            overflow: hidden;
        }

        .tv-mode.active { display: flex; }

        .tv-header {
            background: linear-gradient(135deg, #0d0d0d, #111111);
            padding: 20px 40px;
            text-align: center;
            border-bottom: 4px solid #ff6a00;
            flex-shrink: 0;
        }

        .tv-header img.logo { width: 100px; margin-bottom: 8px; }

        .tv-header h1 {
            font-size: 3em;
            color: #ff6a00;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(255,106,0,0.7);
        }

        .tv-drill-name {
            font-size: 1.8em;
            color: #ffffff;
            margin-top: 8px;
            letter-spacing: 3px;
        }

        .tv-drill-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: #111111;
            border-bottom: 2px solid rgba(255,106,0,0.3);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .tv-drill-nav-btn {
            padding: 8px 18px;
            background: #1a1a1a;
            border: 2px solid #ff6a00;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tv-drill-nav-btn:hover { background: #ff6a00; transform: translateY(-1px); }
        .tv-drill-nav-btn.active { background: #ff6a00; color: #fff; }

        .tv-nav-arrow {
            background: none;
            border: 2px solid #ff6a00;
            color: #ff6a00;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tv-nav-arrow:hover { background: #ff6a00; color: #fff; }

        /* ── CONTROLS BAR (rotation + mode toggle combined) ── */
        .tv-controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid rgba(255,106,0,0.2);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .tv-controls-bar label {
            color: #ff6a00;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tv-controls-bar select {
            background: #0d0d0d;
            border: 1px solid #ff6a00;
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85em;
        }

        .controls-divider {
            width: 1px;
            height: 28px;
            background: rgba(255,106,0,0.4);
            flex-shrink: 0;
        }

        .auto-rotate-btn {
            padding: 7px 16px;
            border: 2px solid #ff6a00;
            border-radius: 15px;
            background: transparent;
            color: #ff6a00;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .auto-rotate-btn.active { background: #ff6a00; color: #fff; }
        .auto-rotate-btn:hover { background: #ff6a00; color: #fff; }

        .drill-indicator { color: #888; font-size: 0.8em; white-space: nowrap; }

        /* Mode toggle buttons — now inline in controls bar */
        .mode-btn {
            padding: 7px 18px;
            border: 2px solid #ff6a00;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .mode-btn.active { background: #ff6a00; color: #fff; }
        .mode-btn:not(.active) { background: rgba(13,13,13,0.95); color: #ff6a00; }
        .mode-btn:hover { box-shadow: 0 4px 15px rgba(255,106,0,0.4); }

        /* Admin mode controls bar at bottom of header */
        .admin-controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: #1a1a1a;
            border-bottom: 1px solid rgba(255,106,0,0.2);
            flex-wrap: wrap;
        }

        .tv-scores-wrapper {
            flex: 1;
            overflow: hidden;
            padding: 10px 40px;
            display: flex;
            flex-direction: column;
        }

        .tv-scores-container {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #ff6a00 #0d0d0d;
        }

        .tv-scores-container::-webkit-scrollbar { width: 6px; }
        .tv-scores-container::-webkit-scrollbar-track { background: #0d0d0d; }
        .tv-scores-container::-webkit-scrollbar-thumb { background: #ff6a00; border-radius: 3px; }

        /* ── TV SCORE ROW ── */
        .tv-score-row {
            display: grid;
            grid-template-columns: 70px 1fr auto;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,106,0,0.15);
            gap: 12px;
        }

        .tv-score-row:nth-child(odd) { background: rgba(255,106,0,0.04); }

        .tv-rank { font-size: 1.6em; font-weight: bold; text-align: center; }

        .tv-player-info { display: flex; flex-direction: column; gap: 2px; }

        .tv-player-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.2;
        }

        .tv-player-date { font-size: 0.75em; color: #888; letter-spacing: 0.5px; }

        .tv-score-block { text-align: right; }

        .tv-score {
            font-size: 1.6em;
            font-weight: bold;
            color: #ff6a00;
            display: block;
            line-height: 1.2;
        }

        .tv-pb {
            font-size: 0.65em;
            background: linear-gradient(135deg, #ff6a00, #ff9a40);
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 3px;
            animation: pulse 1.5s infinite;
        }

        .ticker {
            background: #ff6a00;
            padding: 10px 0;
            overflow: hidden;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .ticker-content {
            display: inline-block;
            animation: ticker-scroll 30s linear infinite;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 2px;
            padding-left: 100%;
        }

        @keyframes ticker-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #111111;
            border: 2px solid #ff6a00;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            position: relative;
        }

        .modal h2 {
            color: #ff6a00;
            margin-bottom: 20px;
            font-size: 1.3em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal .form-group { margin-bottom: 15px; }

        .modal .form-group label {
            display: block;
            color: #ff6a00;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 10px 15px;
            background: #1a1a1a;
            border: 1px solid #ff6a00;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
        }

        .modal .form-group select option { background: #1a1a1a; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: none;
            border: none;
            color: #ff6a00;
            font-size: 1.5em;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.5em; }
            .tv-header h1 { font-size: 2em; }
            .tv-player-name { font-size: 1.1em; }
            .tv-score { font-size: 1.3em; }
            .tv-rank { font-size: 1.3em; }
            .main-content { padding: 10px; }
            .tv-scores-wrapper { padding: 10px 15px; }
            .tv-score-row { grid-template-columns: 50px 1fr auto; gap: 8px; }
            .tv-controls-bar { gap: 8px; }
        }
    </style>
</head>
<body>

<div class="sync-status connecting" id="syncStatus">⏳ Connecting...</div>

<!-- ═══════════════════════════════════════════
     ADMIN MODE
════════════════════════════════════════════ -->
<div id="adminMode">
    <div class="header">
        <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="Logo" class="logo">
        <h1>Breakdown Leaderboard</h1>
    </div>

    <!-- Admin mode toggle bar -->
    <div class="admin-controls-bar">
        <button class="mode-btn active" id="adminBtn" onclick="switchMode('admin')">⚙️ Admin</button>
        <button class="mode-btn" id="tvBtn" onclick="switchMode('tv')">📺 TV Mode</button>
    </div>

    <div class="stats-bar">
        <div class="stat-card">
            <div class="label">Total Drills</div>
            <div class="value" id="statTotalDrills">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Total Entries</div>
            <div class="value" id="statTotalEntries">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Current Leader</div>
            <div class="value" id="statCurrentLeader">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Best Score</div>
            <div class="value" id="statBestScore">—</div>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tabs" id="drillTabs"></div>
    </div>

    <div class="main-content" id="drillPanels"></div>
</div>

<!-- ═══════════════════════════════════════════
     TV MODE
════════════════════════════════════════════ -->
<div class="tv-mode" id="tvMode">
    <div class="tv-header">
        <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="Logo" class="logo">
        <h1>Breakdown Leaderboard</h1>
        <div class="tv-drill-name" id="tvDrillName">—</div>
    </div>

    <div class="tv-drill-nav" id="tvDrillNav">
        <button class="tv-nav-arrow" onclick="tvNavigate(-1)">&#8592;</button>
        <div id="tvDrillNavBtns" style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;"></div>
        <button class="tv-nav-arrow" onclick="tvNavigate(1)">&#8594;</button>
    </div>

    <!-- Combined controls bar: rotation + mode toggle -->
    <div class="tv-controls-bar">
        <button class="auto-rotate-btn" id="autoRotateBtn" onclick="toggleAutoRotate()">▶ Auto Rotate</button>
        <label>Speed:</label>
        <select id="rotateSpeed" onchange="updateRotateSpeed()">
            <option value="5000">5 sec</option>
            <option value="10000" selected>10 sec</option>
            <option value="15000">15 sec</option>
            <option value="20000">20 sec</option>
            <option value="30000">30 sec</option>
        </select>
        <span class="drill-indicator" id="drillIndicator">Drill 1 of 1</span>

        <div class="controls-divider"></div>

        <button class="mode-btn" id="adminBtnTV" onclick="switchMode('admin')">⚙️ Admin</button>
        <button class="mode-btn active" id="tvBtnTV" onclick="switchMode('tv')">📺 TV Mode</button>
    </div>

    <div class="tv-scores-wrapper">
        <div class="tv-scores-container" id="tvScoresContainer"></div>
    </div>

    <div class="ticker">
        <div class="ticker-content" id="tickerContent">
            🏆 BREAKDOWN LEADERBOARD &nbsp;&nbsp;&nbsp; TRAIN HARD. COMPETE HARDER. &nbsp;&nbsp;&nbsp;
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════
     MODALS
════════════════════════════════════════════ -->
<div class="modal-overlay" id="createDrillModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal('createDrillModal')">✕</button>
        <h2>➕ Create New Drill</h2>
        <div class="form-group">
            <label>Drill Name</label>
            <input type="text" id="newDrillName" placeholder="e.g. 30s Sprint" oninput="validateDrillForm()">
        </div>
        <div class="form-group">
            <label>Score Type</label>
            <select id="newDrillType" onchange="validateDrillForm()">
                <option value="">-- Select Type --</option>
                <option value="time">Time (lower is better)</option>
                <option value="count">Count (higher is better)</option>
            </select>
        </div>
        <div class="modal-buttons">
            <button class="btn btn-primary" id="createDrillBtn" onclick="createDrill()" disabled>Create Drill</button>
            <button class="btn btn-secondary" onclick="closeModal('createDrillModal')">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="editScoreModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModal('editScoreModal')">✕</button>
        <h2>✏️ Edit Score</h2>
        <div class="form-group">
            <label>Player Name</label>
            <input type="text" id="editPlayerName" placeholder="Player name">
        </div>
        <div class="form-group">
            <label id="editScoreLabel">Score</label>
            <input type="number" id="editScoreValue" placeholder="Score" step="0.01">
        </div>
        <div class="modal-buttons">
            <button class="btn btn-primary" onclick="saveEditedScore()">Save Changes</button>
            <button class="btn btn-secondary" onclick="closeModal('editScoreModal')">Cancel</button>
        </div>
    </div>
</div>

<!-- ═══════════════════════════════════════════
     FIREBASE + APP SCRIPT
════════════════════════════════════════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ╔══════════════════════════════════════════╗
// ║  PASTE YOUR FIREBASE CONFIG HERE         ║
// ╚══════════════════════════════════════════╝
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── State ──────────────────────────────────
let drills = [];
let scores = {};
let activeDrillId = null;
let currentMode   = 'admin';
let tvDrillIndex  = 0;
let autoRotateInterval = null;
let isAutoRotating     = false;
let editingEntry       = null;
let unsubscribeFn      = null;

// ── Sync status helper ─────────────────────
function setSyncStatus(state, text) {
    const el = document.getElementById('syncStatus');
    el.className = 'sync-status ' + state;
    el.textContent = text;
}

// ══════════════════════════════════════════
//  FIREBASE — real-time listener
// ══════════════════════════════════════════
function startRealtimeSync() {
    setSyncStatus('connecting', '⏳ Connecting...');
    if (unsubscribeFn) unsubscribeFn();

    unsubscribeFn = onSnapshot(
        doc(db, 'leaderboard', 'data'),
        (snap) => {
            setSyncStatus('connected', '🟢 Live');
            if (snap.exists()) {
                const data = snap.data();
                drills = data.drills || [];
                scores = data.scores || {};
            } else {
                // First run — seed default drills
                drills = [
                    { id: 'drill_1', name: '30sec Lane Touch',      type: 'count' },
                    { id: 'drill_2', name: '17s',                    type: 'time'  },
                    { id: 'drill_3', name: '2min Round The World',   type: 'count' },
                    { id: 'drill_4', name: '45 Do Or Die',           type: 'time'  }
                ];
                scores = {};
                drills.forEach(d => { scores[d.id] = []; });
                saveToFirebase();
            }
            if (!activeDrillId && drills.length > 0) activeDrillId = drills[0].id;
            renderAll();
        },
        (error) => {
            console.error('Firestore error:', error);
            setSyncStatus('error', '🔴 Offline');
            // Fall back to localStorage so app still works
            loadFromLocalStorage();
            renderAll();
        }
    );
}

async function saveToFirebase() {
    try {
        await setDoc(doc(db, 'leaderboard', 'data'), { drills, scores });
        saveToLocalStorage(); // keep local backup
    } catch(e) {
        console.error('Save error:', e);
        setSyncStatus('error', '🔴 Save failed');
        saveToLocalStorage();
    }
}

// ── LocalStorage fallback ──────────────────
function loadFromLocalStorage() {
    try {
        const d = localStorage.getItem('bb_drills');
        const s = localStorage.getItem('bb_scores');
        if (d) drills = JSON.parse(d);
        if (s) scores = JSON.parse(s);
        drills.forEach(dr => { if (!scores[dr.id]) scores[dr.id] = []; });
        if (!activeDrillId && drills.length > 0) activeDrillId = drills[0].id;
    } catch(e) {}
}

function saveToLocalStorage() {
    try {
        localStorage.setItem('bb_drills', JSON.stringify(drills));
        localStorage.setItem('bb_scores', JSON.stringify(scores));
    } catch(e) {}
}

// ══════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════
function renderAll() {
    renderTabs();
    renderPanels();
    renderStats();
    renderTVDrillNav();
    renderTVMode();
    updateTicker();
}

function renderTabs() {
    const tabsEl = document.getElementById('drillTabs');
    tabsEl.innerHTML = '';
    drills.forEach(drill => {
        const tab = document.createElement('div');
        tab.className = 'tab' + (drill.id === activeDrillId ? ' active' : '');

        const nameSpan = document.createElement('span');
        nameSpan.textContent = drill.name;
        nameSpan.onclick = () => switchDrill(drill.id);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-drill';
        delBtn.textContent = '✕';
        delBtn.title = 'Delete drill';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteDrill(drill.id); };

        tab.appendChild(nameSpan);
        tab.appendChild(delBtn);
        tabsEl.appendChild(tab);
    });

    const addTab = document.createElement('div');
    addTab.className = 'add-drill-tab';
    addTab.textContent = '+ New Drill';
    addTab.onclick = () => openModal('createDrillModal');
    tabsEl.appendChild(addTab);
}

function switchDrill(drillId) {
    activeDrillId = drillId;
    renderTabs();
    document.querySelectorAll('.drill-panel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById('panel_' + drillId);
    if (panel) panel.classList.add('active');
    renderStats();
}

function renderPanels() {
    const panelsEl = document.getElementById('drillPanels');
    panelsEl.innerHTML = '';
    drills.forEach(drill => {
        const panel = document.createElement('div');
        panel.className = 'drill-panel' + (drill.id === activeDrillId ? ' active' : '');
        panel.id = 'panel_' + drill.id;

        const scoreLabel       = drill.type === 'count' ? 'Count (reps)' : 'Time (seconds)';
        const scorePlaceholder = drill.type === 'count' ? 'e.g. 42' : 'e.g. 20.5';
        const directionHint    = drill.type === 'time'  ? '— Lower is better ⬇️' : '— Higher is better ⬆️';

        // Form
        const formDiv = document.createElement('div');
        formDiv.className = 'add-score-form';
        const formTitle = document.createElement('h3');
        formTitle.textContent = `➕ Add Score — ${drill.name}`;
        formDiv.appendChild(formTitle);

        const formRow = document.createElement('div');
        formRow.className = 'form-row';

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.id   = 'playerName_' + drill.id;
        nameInput.placeholder = 'Player Name';

        const scoreInput = document.createElement('input');
        scoreInput.type  = 'number';
        scoreInput.id    = 'scoreInput_' + drill.id;
        scoreInput.placeholder = scorePlaceholder;
        scoreInput.step  = '0.01';
        scoreInput.min   = '0';

        const addBtn = document.createElement('button');
        addBtn.className = 'btn btn-primary';
        addBtn.textContent = 'Add Score';
        addBtn.addEventListener('click', () => addScore(drill.id));
        nameInput.addEventListener('keydown',  e => { if (e.key === 'Enter') addScore(drill.id); });
        scoreInput.addEventListener('keydown', e => { if (e.key === 'Enter') addScore(drill.id); });

        formRow.appendChild(nameInput);
        formRow.appendChild(scoreInput);
        formRow.appendChild(addBtn);
        formDiv.appendChild(formRow);

        const hint = document.createElement('div');
        hint.style.cssText = 'margin-top:8px; font-size:0.8em; color:#888;';
        hint.innerHTML = `📊 Score type: <strong style="color:#ff6a00;">${scoreLabel}</strong> ${directionHint}`;
        formDiv.appendChild(hint);
        panel.appendChild(formDiv);

        // Controls
        const controlsDiv = document.createElement('div');
        controlsDiv.className = 'drill-controls';
        const clearBtn = document.createElement('button');
        clearBtn.className = 'btn btn-danger';
        clearBtn.textContent = '🗑️ Clear All Scores';
        clearBtn.addEventListener('click', () => clearDrillScores(drill.id));
        controlsDiv.appendChild(clearBtn);
        panel.appendChild(controlsDiv);

        // Leaderboard
        const lbContainer = document.createElement('div');
        lbContainer.className = 'leaderboard-container';
        const lbHeader = document.createElement('div');
        lbHeader.className = 'leaderboard-header';
        lbHeader.innerHTML = `
            <h3>🏆 ${drill.name} — Leaderboard</h3>
            <span style="font-size:0.85em;">${drill.type === 'count' ? '⬆️ Highest First' : '⬇️ Fastest First'}</span>`;
        const lbBody = document.createElement('div');
        lbBody.id = 'leaderboard_' + drill.id;
        lbContainer.appendChild(lbHeader);
        lbContainer.appendChild(lbBody);
        panel.appendChild(lbContainer);
        panelsEl.appendChild(panel);
        renderLeaderboard(drill.id);
    });
}

function getSortedScores(drillId) {
    const drill = drills.find(d => d.id === drillId);
    if (!drill || !scores[drillId]) return [];
    const sorted = [...scores[drillId]];
    drill.type === 'count'
        ? sorted.sort((a, b) => b.score - a.score)
        : sorted.sort((a, b) => a.score - b.score);
    return sorted.slice(0, 50);
}

function renderLeaderboard(drillId) {
    const drill     = drills.find(d => d.id === drillId);
    const container = document.getElementById('leaderboard_' + drillId);
    if (!container || !drill) return;
    const sorted = getSortedScores(drillId);

    if (sorted.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="icon">🏁</div>
                <div>No scores yet. Add the first score!</div>
            </div>`;
        return;
    }

    const scoreColLabel = drill.type === 'count' ? 'Count' : 'Time';
    const table = document.createElement('table');
    table.className = 'leaderboard-table';
    table.innerHTML = `
        <thead>
            <tr>
                <th>Rank</th><th>Player</th><th>${scoreColLabel}</th>
                <th>Date</th><th>Actions</th>
            </tr>
        </thead>`;

    const tbody = document.createElement('tbody');
    sorted.forEach((entry, index) => {
        const rank        = index + 1;
        const rankClass   = rank <= 3 ? `rank-${rank}` : 'rank-other';
        const rankDisplay = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
        const scoreClass  = drill.type === 'count' ? 'score-count' : 'score-time';
        const scoreDisplay = drill.type === 'time' ? entry.score + 's' : entry.score;
        const pbBadge  = entry.isPB ? '<span class="pb-badge">NEW PB! 🔥</span>' : '';
        const dateStr  = entry.timestamp ? new Date(entry.timestamp).toLocaleDateString() : '—';
        const timeStr  = entry.timestamp
            ? new Date(entry.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            : '';

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><span class="rank-badge ${rankClass}">${rankDisplay}</span></td>
            <td>${entry.name}${pbBadge}</td>
            <td><span class="${scoreClass}">${scoreDisplay}</span></td>
            <td><span class="timestamp">${dateStr}<br>${timeStr}</span></td>
            <td></td>`;

        const editBtn = document.createElement('button');
        editBtn.className = 'action-btn edit-btn';
        editBtn.textContent = '✏️';
        editBtn.addEventListener('click', () => openEditModal(drillId, entry.id));

        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn delete-btn';
        delBtn.textContent = '🗑️';
        delBtn.addEventListener('click', () => deleteScore(drillId, entry.id));

        tr.querySelector('td:last-child').appendChild(editBtn);
        tr.querySelector('td:last-child').appendChild(delBtn);
        tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    container.innerHTML = '';
    container.appendChild(table);
}

// ══════════════════════════════════════════
//  SCORE ACTIONS
// ══════════════════════════════════════════
async function addScore(drillId) {
    const drill    = drills.find(d => d.id === drillId);
    const nameEl   = document.getElementById('playerName_'  + drillId);
    const scoreEl  = document.getElementById('scoreInput_'  + drillId);
    if (!drill || !nameEl || !scoreEl) return;

    const name     = nameEl.value.trim();
    const rawScore = scoreEl.value.trim();
    const score    = parseFloat(rawScore);

    if (!name)                              { alert('⚠️ Please enter a player name.');  nameEl.focus();  return; }
    if (rawScore === '' || isNaN(score) || score < 0) { alert('⚠️ Please enter a valid score.'); scoreEl.focus(); return; }

    if (!scores[drillId]) scores[drillId] = [];

    const existing    = scores[drillId].filter(e => e.name.toLowerCase() === name.toLowerCase());
    let isPB          = existing.length === 0;
    if (!isPB) {
        const best = drill.type === 'count'
            ? Math.max(...existing.map(e => e.score))
            : Math.min(...existing.map(e => e.score));
        isPB = drill.type === 'count' ? score > best : score < best;
    }

    scores[drillId].push({
        id:        'entry_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        name, score, isPB,
        timestamp: Date.now()
    });

    await saveToFirebase();
    nameEl.value  = '';
    scoreEl.value = '';
    nameEl.focus();
}

async function deleteScore(drillId, entryId) {
    if (!confirm('Delete this score?')) return;
    scores[drillId] = scores[drillId].filter(e => e.id !== entryId);
    await saveToFirebase();
}

async function clearDrillScores(drillId) {
    const drill = drills.find(d => d.id === drillId);
    if (!drill || !confirm(`Clear ALL scores for "${drill.name}"?`)) return;
    scores[drillId] = [];
    await saveToFirebase();
}

async function deleteDrill(drillId) {
    const drill = drills.find(d => d.id === drillId);
    if (!drill || !confirm(`Delete drill "${drill.name}" and all its scores?`)) return;
    drills = drills.filter(d => d.id !== drillId);
    delete scores[drillId];
    if (activeDrillId === drillId) activeDrillId = drills.length > 0 ? drills[0].id : null;
    if (tvDrillIndex >= drills.length) tvDrillIndex = 0;
    await saveToFirebase();
}

// ── Edit modal ─────────────────────────────
function openEditModal(drillId, entryId) {
    const drill = drills.find(d => d.id === drillId);
    const entry = (scores[drillId] || []).find(e => e.id === entryId);
    if (!drill || !entry) return;
    editingEntry = { drillId, entryId };
    document.getElementById('editPlayerName').value  = entry.name;
    document.getElementById('editScoreValue').value  = entry.score;
    document.getElementById('editScoreLabel').textContent =
        drill.type === 'count' ? 'Count (reps)' : 'Time (seconds)';
    openModal('editScoreModal');
}

async function saveEditedScore() {
    if (!editingEntry) return;
    const { drillId, entryId } = editingEntry;
    const drill      = drills.find(d => d.id === drillId);
    const entryIndex = (scores[drillId] || []).findIndex(e => e.id === entryId);
    if (!drill || entryIndex === -1) return;

    const newName  = document.getElementById('editPlayerName').value.trim();
    const newScore = parseFloat(document.getElementById('editScoreValue').value);
    if (!newName)                    { alert('Please enter a player name.'); return; }
    if (isNaN(newScore) || newScore < 0) { alert('Please enter a valid score.'); return; }

    const others = scores[drillId].filter((e, i) => i !== entryIndex && e.name.toLowerCase() === newName.toLowerCase());
    const isPB   = others.length === 0 ? true
        : drill.type === 'count'
            ? newScore > Math.max(...others.map(e => e.score))
            : newScore < Math.min(...others.map(e => e.score));

    scores[drillId][entryIndex] = {
        ...scores[drillId][entryIndex],
        name: newName, score: newScore, isPB,
        timestamp: Date.now()
    };

    await saveToFirebase();
    closeModal('editScoreModal');
    editingEntry = null;
}

// ── Create drill ───────────────────────────
function validateDrillForm() {
    const name = document.getElementById('newDrillName').value.trim();
    const type = document.getElementById('newDrillType').value;
    document.getElementById('createDrillBtn').disabled = !(name && type);
}

async function createDrill() {
    const name = document.getElementById('newDrillName').value.trim();
    const type = document.getElementById('newDrillType').value;
    if (!name || !type) return;
    const newDrill = { id: 'drill_' + Date.now(), name, type };
    drills.push(newDrill);
    scores[newDrill.id] = [];
    activeDrillId = newDrill.id;
    await saveToFirebase();
    closeModal('createDrillModal');
    document.getElementById('newDrillName').value   = '';
    document.getElementById('newDrillType').value   = '';
    document.getElementById('createDrillBtn').disabled = true;
}

// ══════════════════════════════════════════
//  STATS
// ══════════════════════════════════════════
function renderStats() {
    document.getElementById('statTotalDrills').textContent = drills.length;
    let total = 0;
    drills.forEach(d => { total += (scores[d.id] || []).length; });
    document.getElementById('statTotalEntries').textContent = total;

    if (activeDrillId && (scores[activeDrillId] || []).length > 0) {
        const sorted = getSortedScores(activeDrillId);
        const drill  = drills.find(d => d.id === activeDrillId);
        document.getElementById('statCurrentLeader').textContent = sorted[0].name;
        document.getElementById('statBestScore').textContent =
            drill.type === 'time' ? sorted[0].score + 's' : sorted[0].score;
    } else {
        document.getElementById('statCurrentLeader').textContent = '—';
        document.getElementById('statBestScore').textContent     = '—';
    }
}

// ══════════════════════════════════════════
//  TV MODE
// ══════════════════════════════════════════
function renderTVMode() {
    if (drills.length === 0) {
        document.getElementById('tvDrillName').textContent      = 'No Drills';
        document.getElementById('tvScoresContainer').innerHTML  = '';
        return;
    }
    if (tvDrillIndex >= drills.length) tvDrillIndex = 0;
    renderTVDrill(drills[tvDrillIndex]);
}

function renderTVDrill(drill) {
    document.getElementById('tvDrillName').textContent = drill.name;
    document.getElementById('drillIndicator').textContent =
        `Drill ${tvDrillIndex + 1} of ${drills.length}`;

    const sorted    = getSortedScores(drill.id);
    const container = document.getElementById('tvScoresContainer');

    if (sorted.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:60px;color:#888;font-size:1.5em;">
                No scores yet for this drill
            </div>`;
        renderTVDrillNav();
        return;
    }

    let html = '';
    sorted.forEach((entry, index) => {
        const rank         = index + 1;
        const rankDisplay  = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
        const scoreDisplay = drill.type === 'time' ? entry.score + 's' : entry.score;
        const pbBadge      = entry.isPB ? '<span class="tv-pb">🔥 PB</span>' : '';
        const dateStr      = entry.timestamp
            ? new Date(entry.timestamp).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
            : '—';

        html += `
            <div class="tv-score-row">
                <div class="tv-rank">${rankDisplay}</div>
                <div class="tv-player-info">
                    <div class="tv-player-name">${entry.name} ${pbBadge}</div>
                    <div class="tv-player-date">📅 ${dateStr}</div>
                </div>
                <div class="tv-score-block">
                    <span class="tv-score">${scoreDisplay}</span>
                </div>
            </div>`;
    });

    container.innerHTML = html;
    renderTVDrillNav();
}

function renderTVDrillNav() {
    const navBtns = document.getElementById('tvDrillNavBtns');
    if (!navBtns) return;
    navBtns.innerHTML = '';
    drills.forEach((drill, index) => {
        const btn = document.createElement('button');
        btn.className = 'tv-drill-nav-btn' + (index === tvDrillIndex ? ' active' : '');
        btn.textContent = drill.name;
        btn.addEventListener('click', () => { tvDrillIndex = index; renderTVMode(); });
        navBtns.appendChild(btn);
    });
}

function tvNavigate(direction) {
    if (drills.length === 0) return;
    tvDrillIndex = (tvDrillIndex + direction + drills.length) % drills.length;
    renderTVMode();
}

function toggleAutoRotate() {
    isAutoRotating = !isAutoRotating;
    const btn = document.getElementById('autoRotateBtn');
    if (isAutoRotating) {
        btn.textContent = '⏸ Stop Rotation';
        btn.classList.add('active');
        startAutoRotate();
    } else {
        btn.textContent = '▶ Auto Rotate';
        btn.classList.remove('active');
        stopAutoRotate();
    }
}

function startAutoRotate() {
    stopAutoRotate();
    if (drills.length === 0) return;
    const speed = parseInt(document.getElementById('rotateSpeed').value);
    autoRotateInterval = setInterval(() => {
        tvDrillIndex = (tvDrillIndex + 1) % drills.length;
        renderTVMode();
    }, speed);
}

function stopAutoRotate() {
    if (autoRotateInterval) { clearInterval(autoRotateInterval); autoRotateInterval = null; }
}

function updateRotateSpeed() { if (isAutoRotating) startAutoRotate(); }

function updateTicker() {
    let text = '🏆 BREAKDOWN LEADERBOARD &nbsp;&nbsp;&nbsp; TRAIN HARD. COMPETE HARDER. &nbsp;&nbsp;&nbsp;';
    drills.forEach(drill => {
        const sorted = getSortedScores(drill.id);
        if (sorted.length > 0) {
            const sd = drill.type === 'time' ? sorted[0].score + 's' : sorted[0].score;
            text += `🏅 ${drill.name}: ${sorted[0].name} — ${sd} &nbsp;&nbsp;&nbsp; `;
        }
    });
    const el = document.getElementById('tickerContent');
    if (el) el.innerHTML = text;
}

// ══════════════════════════════════════════
//  MODE SWITCH
// ══════════════════════════════════════════
function switchMode(mode) {
    currentMode = mode;
    const adminMode = document.getElementById('adminMode');
    const tvMode    = document.getElementById('tvMode');

    // Admin bar buttons
    document.getElementById('adminBtn').classList.toggle('active', mode === 'admin');
    document.getElementById('tvBtn').classList.toggle('active',    mode === 'tv');
    // TV bar buttons
    document.getElementById('adminBtnTV').classList.toggle('active', mode === 'admin');
    document.getElementById('tvBtnTV').classList.toggle('active',    mode === 'tv');

    if (mode === 'tv') {
        adminMode.style.display = 'none';
        tvMode.classList.add('active');
        renderTVMode();
    } else {
        adminMode.style.display = 'block';
        tvMode.classList.remove('active');
    }
}

// ── Modals ─────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(overlay.id); });
});

// Expose functions needed by inline HTML attributes
window.tvNavigate        = tvNavigate;
window.toggleAutoRotate  = toggleAutoRotate;
window.updateRotateSpeed = updateRotateSpeed;
window.switchMode        = switchMode;
window.openModal         = openModal;
window.closeModal        = closeModal;
window.validateDrillForm = validateDrillForm;
window.createDrill       = createDrill;
window.saveEditedScore   = saveEditedScore;

// ── Boot ───────────────────────────────────
startRealtimeSync();
</script>
</body>
</html>
