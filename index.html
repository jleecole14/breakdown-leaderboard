<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakdown Leaderboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #ff6a00;
        }

        .header img {
            height: 80px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 2em;
            color: #ff6a00;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* TABS */
        .tabs-container {
            background: #1a1a1a;
            padding: 15px 20px 0;
            border-bottom: 2px solid #333;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .tab-btn {
            background: #2d2d2d;
            color: #aaa;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover { background: #3d3d3d; color: #fff; }

        .tab-btn.active {
            background: #ff6a00;
            color: #fff;
            border-color: #ff6a00;
        }

        .tab-delete {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 0.9em;
            padding: 0 2px;
            line-height: 1;
        }

        .add-drill-tab {
            background: #1a3a1a;
            color: #4CAF50;
            border: 1px dashed #4CAF50;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .add-drill-tab:hover { background: #2a4a2a; }

        /* MAIN CONTENT */
        .main-content {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 100px;
        }

        /* STATS BAR */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-card .label {
            font-size: 0.7em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 1.3em;
            font-weight: bold;
            color: #ff6a00;
            margin-top: 4px;
        }

        /* FORM SECTION */
        .form-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-section h3 {
            color: #ff6a00;
            margin-bottom: 15px;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-row input, .form-row select {
            flex: 1;
            min-width: 150px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.95em;
        }

        .form-row input:focus, .form-row select:focus {
            outline: none;
            border-color: #ff6a00;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-orange {
            background: #ff6a00;
            color: #fff;
        }

        .btn-orange:hover { background: #e55a00; }

        .btn-red {
            background: #c0392b;
            color: #fff;
        }

        .btn-red:hover { background: #a93226; }

        .btn-green {
            background: #27ae60;
            color: #fff;
        }

        .btn-green:hover { background: #229954; }

        /* LEADERBOARD */
        .leaderboard {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }

        .leaderboard-header {
            background: #ff6a00;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leaderboard-header h3 {
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #2d2d2d;
            padding: 10px 16px;
            text-align: left;
            font-size: 0.8em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tbody tr {
            border-bottom: 1px solid #222;
            transition: background 0.2s;
        }

        tbody tr:hover { background: #222; }

        tbody td {
            padding: 12px 16px;
            font-size: 0.95em;
        }

        .rank-1 { color: #FFD700; font-weight: bold; }
        .rank-2 { color: #C0C0C0; font-weight: bold; }
        .rank-3 { color: #CD7F32; font-weight: bold; }

        .score-time { color: #4fc3f7; font-weight: bold; }
        .score-count { color: #81c784; font-weight: bold; }

        .pb-badge {
            background: #ff6a00;
            color: white;
            font-size: 0.65em;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 6px;
            white-space: nowrap;
        }

        .delete-entry-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 0.9em;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .delete-entry-btn:hover { color: #ff4444; background: #2d2d2d; }

        .edit-entry-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 0.9em;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .edit-entry-btn:hover { color: #ff6a00; background: #2d2d2d; }

        .timestamp {
            font-size: 0.75em;
            color: #555;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #555;
        }

        .empty-state .icon { font-size: 2em; margin-bottom: 10px; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a1a;
            border: 2px solid #ff6a00;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 420px;
            position: relative;
            z-index: 10000;
        }

        .modal h2 {
            color: #ff6a00;
            margin-bottom: 20px;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .modal input, .modal select {
            width: 100%;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 1em;
            margin-bottom: 15px;
            display: block;
        }

        .modal input:focus, .modal select:focus {
            outline: none;
            border-color: #ff6a00;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .modal-confirm {
            background: #ff6a00;
            color: white;
        }

        .modal-confirm:hover { background: #e55a00; }

        .modal-cancel {
            background: #333;
            color: #aaa;
        }

        .modal-cancel:hover { background: #444; color: #fff; }

        /* MODE TOGGLE */
        .mode-toggle {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
            background: #1a1a1a;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .mode-toggle button {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s;
        }

        .mode-toggle .active-mode {
            background: #ff6a00;
            color: white;
        }

        .mode-toggle .inactive-mode {
            background: #2d2d2d;
            color: #888;
        }

        /* TV MODE */
        .tv-mode {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 500;
            flex-direction: column;
            overflow: hidden;
        }

        .tv-mode.active { display: flex; }

        .tv-header {
            background: #111;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid #ff6a00;
            gap: 20px;
        }

        .tv-header img { height: 60px; }

        .tv-header h1 {
            font-size: 2.5em;
            color: #ff6a00;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .tv-drill-tabs {
            display: flex;
            gap: 10px;
            padding: 15px 40px;
            background: #111;
            border-bottom: 1px solid #222;
            flex-wrap: wrap;
        }

        .tv-drill-tab {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #888;
            transition: all 0.3s;
        }

        .tv-drill-tab.active {
            background: #ff6a00;
            color: white;
            border-color: #ff6a00;
        }

        .tv-content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 20px 40px;
        }

        .tv-scores-container {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #ff6a00 #1a1a1a;
        }

        .tv-scores-container::-webkit-scrollbar { width: 6px; }
        .tv-scores-container::-webkit-scrollbar-track { background: #1a1a1a; }
        .tv-scores-container::-webkit-scrollbar-thumb { background: #ff6a00; border-radius: 3px; }

        .tv-table {
            width: 100%;
            border-collapse: collapse;
        }

        .tv-table th {
            background: #1a1a1a;
            color: #ff6a00;
            padding: 14px 20px;
            text-align: left;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: sticky;
            top: 0;
        }

        .tv-table td {
            padding: 14px 20px;
            font-size: 1.3em;
            border-bottom: 1px solid #1a1a1a;
        }

        .tv-table tr:hover { background: #111; }

        .tv-rank { font-size: 1.4em; font-weight: bold; }
        .tv-name { font-size: 1.3em; }
        .tv-score { font-size: 1.5em; font-weight: bold; color: #ff6a00; }

        .tv-ticker {
            background: #ff6a00;
            padding: 8px 0;
            overflow: hidden;
            white-space: nowrap;
        }

        .tv-ticker-inner {
            display: inline-block;
            animation: ticker 30s linear infinite;
            font-size: 0.9em;
            font-weight: bold;
            letter-spacing: 2px;
        }

        @keyframes ticker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* NOTIFICATION */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff6a00;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 99999;
            transform: translateX(200px);
            opacity: 0;
            transition: all 0.3s;
        }

        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.3em; }
            .form-row { flex-direction: column; }
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="Logo">
    <h1>Breakdown Leaderboard</h1>
</div>

<!-- DRILL TABS -->
<div class="tabs-container" id="tabsContainer"></div>

<!-- MAIN CONTENT -->
<div class="main-content" id="adminPanel">

    <!-- STATS BAR -->
    <div class="stats-bar" id="statsBar"></div>

    <!-- ADD SCORE FORM -->
    <div class="form-section">
        <h3>➕ Add Score</h3>
        <div class="form-row">
            <input type="text" id="playerName" placeholder="Player Name" />
            <input type="text" id="playerScore" placeholder="Score / Time (e.g. 20.5)" />
            <button class="btn btn-orange" onclick="addEntry()">Add Score</button>
        </div>
    </div>

    <!-- LEADERBOARD TABLE -->
    <div class="leaderboard">
        <div class="leaderboard-header">
            <h3 id="leaderboardTitle">Leaderboard</h3>
            <button class="btn btn-red" onclick="clearDrill()" style="font-size:0.75em; padding:6px 14px;">Clear All</button>
        </div>
        <div id="leaderboardBody"></div>
    </div>
</div>

<!-- TV MODE -->
<div class="tv-mode" id="tvMode">
    <div class="tv-header">
        <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="Logo">
        <h1>Breakdown Leaderboard</h1>
    </div>
    <div class="tv-drill-tabs" id="tvDrillTabs"></div>
    <div class="tv-content">
        <div class="tv-scores-container">
            <table class="tv-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th id="tvScoreHeader">Score</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="tvLeaderboardBody"></tbody>
            </table>
        </div>
    </div>
    <div class="tv-ticker">
        <span class="tv-ticker-inner" id="tvTicker">🏆 BREAKDOWN LEADERBOARD — LIVE RESULTS 🏆</span>
    </div>
</div>

<!-- MODE TOGGLE -->
<div class="mode-toggle">
    <button id="adminModeBtn" class="active-mode" onclick="setMode('admin')">⚙️ Admin</button>
    <button id="tvModeBtn" class="inactive-mode" onclick="setMode('tv')">📺 TV Mode</button>
</div>

<!-- ADD DRILL MODAL -->
<div class="modal-overlay" id="addDrillModal">
    <div class="modal">
        <h2>➕ New Drill</h2>
        <input type="text" id="newDrillName" placeholder="Drill Name (e.g. 30s Sprint)" />
        <select id="newDrillType">
            <option value="time">⏱ Time Based (lower is better)</option>
            <option value="count">🔢 Count Based (higher is better)</option>
        </select>
        <div class="modal-buttons">
            <button class="modal-cancel" onclick="closeAddDrillModal()">Cancel</button>
            <button class="modal-confirm" onclick="confirmAddDrill()">✅ Create Drill</button>
        </div>
    </div>
</div>

<!-- EDIT SCORE MODAL -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2>✏️ Edit Score</h2>
        <input type="text" id="editPlayerName" placeholder="Player Name" />
        <input type="text" id="editPlayerScore" placeholder="New Score / Time" />
        <input type="hidden" id="editEntryId" />
        <div class="modal-buttons">
            <button class="modal-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="modal-confirm" onclick="confirmEdit()">✅ Save Changes</button>
        </div>
    </div>
</div>

<!-- NOTIFICATION -->
<div class="notification" id="notification"></div>

<script>
// ============================================================
// DATA
// ============================================================
let drills = {};
let currentDrill = null;

const DEFAULT_DRILLS = [
    { name: "30sec Lane Touch", type: "count" },
    { name: "17s", type: "time" },
    { name: "2min Round The World", type: "time" },
    { name: "45 Do or Die", type: "time" }
];

// ============================================================
// INIT
// ============================================================
function init() {
    const saved = localStorage.getItem('breakdownLeaderboard');
    if (saved) {
        drills = JSON.parse(saved);
    } else {
        DEFAULT_DRILLS.forEach(d => {
            drills[d.name] = { type: d.type, entries: [] };
        });
    }

    const keys = Object.keys(drills);
    if (keys.length > 0) {
        currentDrill = keys[0];
    }

    renderTabs();
    renderLeaderboard();
    renderStats();
    renderTV();
}

// ============================================================
// SAVE
// ============================================================
function save() {
    localStorage.setItem('breakdownLeaderboard', JSON.stringify(drills));
}

// ============================================================
// TABS
// ============================================================
function renderTabs() {
    const container = document.getElementById('tabsContainer');
    container.innerHTML = '';

    Object.keys(drills).forEach(name => {
        const tab = document.createElement('div');
        tab.className = 'tab-btn' + (name === currentDrill ? ' active' : '');

        const label = document.createElement('span');
        label.textContent = name;
        label.style.cursor = 'pointer';
        label.onclick = () => switchDrill(name);

        const del = document.createElement('button');
        del.className = 'tab-delete';
        del.textContent = '✕';
        del.title = 'Delete drill';
        del.onclick = (e) => {
            e.stopPropagation();
            deleteDrill(name);
        };

        tab.appendChild(label);
        tab.appendChild(del);
        container.appendChild(tab);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-drill-tab';
    addBtn.textContent = '+ Add Drill';
    addBtn.onclick = openAddDrillModal;
    container.appendChild(addBtn);
}

function switchDrill(name) {
    currentDrill = name;
    renderTabs();
    renderLeaderboard();
    renderStats();
    renderTV();
}

// ============================================================
// ADD DRILL MODAL
// ============================================================
function openAddDrillModal() {
    document.getElementById('newDrillName').value = '';
    document.getElementById('newDrillType').value = 'time';
    document.getElementById('addDrillModal').classList.add('active');
}

function closeAddDrillModal() {
    document.getElementById('addDrillModal').classList.remove('active');
}

function confirmAddDrill() {
    const name = document.getElementById('newDrillName').value.trim();
    const type = document.getElementById('newDrillType').value;

    if (!name) {
        showNotification('⚠️ Please enter a drill name!');
        return;
    }

    if (drills[name]) {
        showNotification('⚠️ A drill with that name already exists!');
        return;
    }

    drills[name] = { type: type, entries: [] };
    currentDrill = name;
    save();
    closeAddDrillModal();
    renderTabs();
    renderLeaderboard();
    renderStats();
    renderTV();
    showNotification('✅ Drill "' + name + '" created!');
}

// ============================================================
// DELETE DRILL
// ============================================================
function deleteDrill(name) {
    if (!confirm('Delete drill "' + name + '" and all its scores?')) return;
    delete drills[name];
    const keys = Object.keys(drills);
    currentDrill = keys.length > 0 ? keys[0] : null;
    save();
    renderTabs();
    renderLeaderboard();
    renderStats();
    renderTV();
    showNotification('🗑️ Drill deleted');
}

// ============================================================
// ADD ENTRY
// ============================================================
function addEntry() {
    if (!currentDrill) {
        showNotification('⚠️ No drill selected!');
        return;
    }

    const nameInput = document.getElementById('playerName');
    const scoreInput = document.getElementById('playerScore');
    const name = nameInput.value.trim();
    const scoreRaw = scoreInput.value.trim();

    if (!name || !scoreRaw) {
        showNotification('⚠️ Enter both name and score!');
        return;
    }

    const score = parseFloat(scoreRaw);
    if (isNaN(score) || score < 0) {
        showNotification('⚠️ Enter a valid number!');
        return;
    }

    const drill = drills[currentDrill];
    const now = new Date();
    const timestamp = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

    // Check personal best
    const existing = drill.entries.filter(e => e.name.toLowerCase() === name.toLowerCase());
    let isPB = false;
    if (existing.length === 0) {
        isPB = true;
    } else {
        const bestExisting = drill.type === 'count'
            ? Math.max(...existing.map(e => e.score))
            : Math.min(...existing.map(e => e.score));
        isPB = drill.type === 'count' ? score > bestExisting : score < bestExisting;
    }

    const entry = {
        id: Date.now(),
        name: name,
        score: score,
        timestamp: timestamp,
        isPB: isPB
    };

    drill.entries.push(entry);

    // Keep top 50
    sortEntries(drill);
    if (drill.entries.length > 50) {
        drill.entries = drill.entries.slice(0, 50);
    }

    save();
    nameInput.value = '';
    scoreInput.value = '';

    renderLeaderboard();
    renderStats();
    renderTV();

    if (isPB) {
        showNotification('🔥 NEW PB for ' + name + '!');
    } else {
        showNotification('✅ Score added!');
    }
}

// ============================================================
// SORT
// ============================================================
function sortEntries(drill) {
    drill.entries.sort((a, b) => {
        return drill.type === 'count' ? b.score - a.score : a.score - b.score;
    });
}

// ============================================================
// DELETE ENTRY
// ============================================================
function deleteEntry(id) {
    if (!currentDrill) return;
    drills[currentDrill].entries = drills[currentDrill].entries.filter(e => e.id !== id);
    save();
    renderLeaderboard();
    renderStats();
    renderTV();
    showNotification('🗑️ Entry removed');
}

// ============================================================
// CLEAR DRILL
// ============================================================
function clearDrill() {
    if (!currentDrill) return;
    if (!confirm('Clear ALL scores for "' + currentDrill + '"?')) return;
    drills[currentDrill].entries = [];
    save();
    renderLeaderboard();
    renderStats();
    renderTV();
    showNotification('🗑️ All scores cleared');
}

// ============================================================
// EDIT ENTRY
// ============================================================
function openEditModal(id) {
    const drill = drills[currentDrill];
    const entry = drill.entries.find(e => e.id === id);
    if (!entry) return;

    document.getElementById('editPlayerName').value = entry.name;
    document.getElementById('editPlayerScore').value = entry.score;
    document.getElementById('editEntryId').value = id;
    document.getElementById('editModal').classList.add('active');
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
}

function confirmEdit() {
    const id = parseInt(document.getElementById('editEntryId').value);
    const name = document.getElementById('editPlayerName').value.trim();
    const scoreRaw = document.getElementById('editPlayerScore').value.trim();

    if (!name || !scoreRaw) {
        showNotification('⚠️ Fill in all fields!');
        return;
    }

    const score = parseFloat(scoreRaw);
    if (isNaN(score) || score < 0) {
        showNotification('⚠️ Enter a valid number!');
        return;
    }

    const drill = drills[currentDrill];
    const entry = drill.entries.find(e => e.id === id);
    if (!entry) return;

    entry.name = name;
    entry.score = score;

    // Recalculate PB
    const allForPlayer = drill.entries.filter(e => e.name.toLowerCase() === name.toLowerCase());
    const bestScore = drill.type === 'count'
        ? Math.max(...allForPlayer.map(e => e.score))
        : Math.min(...allForPlayer.map(e => e.score));

    allForPlayer.forEach(e => {
        e.isPB = e.score === bestScore;
    });

    sortEntries(drill);
    save();
    closeEditModal();
    renderLeaderboard();
    renderStats();
    renderTV();
    showNotification('✅ Score updated!');
}

// ============================================================
// RENDER LEADERBOARD
// ============================================================
function renderLeaderboard() {
    const body = document.getElementById('leaderboardBody');
    const title = document.getElementById('leaderboardTitle');

    if (!currentDrill) {
        body.innerHTML = '<div class="empty-state"><div class="icon">🏋️</div><p>No drill selected</p></div>';
        return;
    }

    const drill = drills[currentDrill];
    title.textContent = currentDrill + ' — ' + (drill.type === 'count' ? 'Most Reps' : 'Fastest Time');

    if (drill.entries.length === 0) {
        body.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>No scores yet — add the first one!</p></div>';
        return;
    }

    const scoreLabel = drill.type === 'count' ? 'Reps' : 'Time';

    let html = '<table><thead><tr><th>Rank</th><th>Player</th><th>' + scoreLabel + '</th><th>Date</th><th></th></tr></thead><tbody>';

    drill.entries.forEach((entry, index) => {
        const rank = index + 1;
        let rankClass = '';
        let rankIcon = rank;
        if (rank === 1) { rankClass = 'rank-1'; rankIcon = '🥇'; }
        else if (rank === 2) { rankClass = 'rank-2'; rankIcon = '🥈'; }
        else if (rank === 3) { rankClass = 'rank-3'; rankIcon = '🥉'; }

        const scoreClass = drill.type === 'count' ? 'score-count' : 'score-time';
        const scoreDisplay = drill.type === 'time' ? entry.score.toFixed(2) + 's' : entry.score;
        const pbBadge = entry.isPB ? '<span class="pb-badge">NEW PB 🔥</span>' : '';

        html += '<tr>';
        html += '<td class="' + rankClass + '">' + rankIcon + '</td>';
        html += '<td>' + entry.name + pbBadge + '</td>';
        html += '<td class="' + scoreClass + '">' + scoreDisplay + '</td>';
        html += '<td class="timestamp">' + entry.timestamp + '</td>';
        html += '<td>';
        html += '<button class="edit-entry-btn" onclick="openEditModal(' + entry.id + ')">✏️</button>';
        html += '<button class="delete-entry-btn" onclick="deleteEntry(' + entry.id + ')">🗑️</button>';
        html += '</td>';
        html += '</tr>';
    });

    html += '</tbody></table>';
    body.innerHTML = html;
}

// ============================================================
// RENDER STATS
// ============================================================
function renderStats() {
    const bar = document.getElementById('statsBar');
    if (!currentDrill) { bar.innerHTML = ''; return; }

    const drill = drills[currentDrill];
    const entries = drill.entries;
    const totalDrills = Object.keys(drills).length;

    let leader = '—';
    let best = '—';

    if (entries.length > 0) {
        leader = entries[0].name;
        best = drill.type === 'time' ? entries[0].score.toFixed(2) + 's' : entries[0].score + ' reps';
    }

    bar.innerHTML = `
        <div class="stat-card">
            <div class="label">Total Entries</div>
            <div class="value">${entries.length}</div>
        </div>
        <div class="stat-card">
            <div class="label">Current Leader</div>
            <div class="value" style="font-size:1em">${leader}</div>
        </div>
        <div class="stat-card">
            <div class="label">Best Score</div>
            <div class="value">${best}</div>
        </div>
        <div class="stat-card">
            <div class="label">Total Drills</div>
            <div class="value">${totalDrills}</div>
        </div>
    `;
}

// ============================================================
// RENDER TV
// ============================================================
function renderTV() {
    const tabsContainer = document.getElementById('tvDrillTabs');
    const body = document.getElementById('tvLeaderboardBody');
    const header = document.getElementById('tvScoreHeader');
    const ticker = document.getElementById('tvTicker');

    // Tabs
    tabsContainer.innerHTML = '';
    Object.keys(drills).forEach(name => {
        const tab = document.createElement('div');
        tab.className = 'tv-drill-tab' + (name === currentDrill ? ' active' : '');
        tab.textContent = name;
        tab.onclick = () => switchDrill(name);
        tabsContainer.appendChild(tab);
    });

    if (!currentDrill) return;

    const drill = drills[currentDrill];
    header.textContent = drill.type === 'count' ? 'Reps' : 'Time';

    body.innerHTML = '';

    if (drill.entries.length === 0) {
        body.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#555; padding:40px; font-size:1.2em;">No scores yet</td></tr>';
        return;
    }

    drill.entries.forEach((entry, index) => {
        const rank = index + 1;
        let rankIcon = rank;
        if (rank === 1) rankIcon = '🥇';
        else if (rank === 2) rankIcon = '🥈';
        else if (rank === 3) rankIcon = '🥉';

        const scoreDisplay = drill.type === 'time' ? entry.score.toFixed(2) + 's' : entry.score + ' reps';
        const pbText = entry.isPB ? ' 🔥' : '';

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="tv-rank">${rankIcon}</td>
            <td class="tv-name">${entry.name}${pbText}</td>
            <td class="tv-score">${scoreDisplay}</td>
            <td style="color:#555; font-size:0.9em">${entry.timestamp}</td>
        `;
        body.appendChild(tr);
    });

    // Ticker
    const leaders = Object.entries(drills).map(([name, drill]) => {
        if (drill.entries.length === 0) return null;
        const top = drill.entries[0];
        const score = drill.type === 'time' ? top.score.toFixed(2) + 's' : top.score + ' reps';
        return `🏆 ${name}: ${top.name} (${score})`;
    }).filter(Boolean);

    ticker.textContent = leaders.length > 0
        ? leaders.join('   •   ')
        : '🏆 BREAKDOWN LEADERBOARD — LIVE RESULTS 🏆';
}

// ============================================================
// MODE TOGGLE
// ============================================================
function setMode(mode) {
    const tvMode = document.getElementById('tvMode');
    const adminPanel = document.getElementById('adminPanel');
    const tabsContainer = document.getElementById('tabsContainer');
    const adminBtn = document.getElementById('adminModeBtn');
    const tvBtn = document.getElementById('tvModeBtn');

    if (mode === 'tv') {
        tvMode.classList.add('active');
        adminPanel.style.display = 'none';
        tabsContainer.style.display = 'none';
        adminBtn.className = 'inactive-mode';
        tvBtn.className = 'active-mode';
    } else {
        tvMode.classList.remove('active');
        adminPanel.style.display = 'block';
        tabsContainer.style.display = 'flex';
        adminBtn.className = 'active-mode';
        tvBtn.className = 'inactive-mode';
    }
}

// ============================================================
// NOTIFICATION
// ============================================================
function showNotification(msg) {
    const n = document.getElementById('notification');
    n.textContent = msg;
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 3000);
}

// ============================================================
// START
// ============================================================
init();
</script>
</body>
</html>
