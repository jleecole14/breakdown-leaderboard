<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Breakdown Leaderboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    /* ── MODE TOGGLE ── */
    .mode-toggle {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 2000;
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      padding: 8px 16px;
      border: 1px solid #ff6a00;
      border-radius: 20px;
      background: transparent;
      color: #ff6a00;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: #ff6a00;
      color: #fff;
    }

    .mode-btn:hover { background: #ff6a00; color: #fff; }

    #adminView { display: block; }
    #presentationView { display: none; }

    header {
      background: #111;
      padding: 20px 20px 16px;
      text-align: center;
      border-bottom: 3px solid #ff6a00;
    }

    header img { width: 100px; margin-bottom: 8px; }

    header h1 {
      font-size: 1.8rem;
      color: #ff6a00;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .sync-status {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .sync-online  { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
    .sync-offline { background: #3a1a1a; color: #f44336; border: 1px solid #f44336; }
    .sync-syncing { background: #3a2a1a; color: #ff9800; border: 1px solid #ff9800; }

    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-top: 3px solid #ff6a00;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }

    .stat-card .label {
      font-size: 0.68rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff6a00;
    }

    .tabs-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 14px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      color: #aaa;
      transition: all 0.2s;
    }

    .tab:hover { border-color: #ff6a00; color: #fff; }

    .tab.active {
      background: #ff6a00;
      color: #fff;
      border-color: #ff6a00;
      font-weight: bold;
    }

    .tab .delete-tab {
      background: rgba(0,0,0,0.3);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .tab:hover .delete-tab { opacity: 1; }

    .add-drill-btn {
      padding: 9px 14px;
      background: transparent;
      border: 1px dashed #ff6a00;
      border-radius: 6px;
      color: #ff6a00;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }

    .add-drill-btn:hover { background: #ff6a00; color: #fff; }

    .drill-panel { display: none; }
    .drill-panel.active { display: block; }

    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .panel-grid { grid-template-columns: 1fr; }
      header h1 { font-size: 1.2rem; }
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 18px;
    }

    .card h3 {
      color: #ff6a00;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
    }

    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      font-size: 0.72rem;
      color: #888;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 0.92rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #ff6a00;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn-primary   { background: #ff6a00; color: #fff; }
    .btn-primary:hover { background: #e55e00; }
    .btn-danger    { background: #c0392b; color: #fff; margin-top: 8px; }
    .btn-danger:hover { background: #a93226; }
    .btn-secondary { background: #333; color: #fff; }
    .btn-secondary:hover { background: #444; }
    .btn-warning   { background: #e67e22; color: #fff; }
    .btn-warning:hover { background: #ca6f1e; }

    .leaderboard-header {
      background: #ff6a00;
      border-radius: 8px 8px 0 0;
      padding: 10px 16px;
      display: grid;
      grid-template-columns: 50px 1fr 110px 160px;
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .leaderboard-list { border-radius: 0 0 8px 8px; overflow: hidden; }

    .leaderboard-entry {
      display: grid;
      grid-template-columns: 50px 1fr 110px 160px;
      padding: 10px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #222;
      align-items: center;
      font-size: 0.85rem;
      transition: background 0.2s;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .leaderboard-entry:hover { background: #222; }
    .leaderboard-entry:nth-child(1) { background: #1a1500; border-left: 3px solid #ffd700; }
    .leaderboard-entry:nth-child(2) { background: #161616; border-left: 3px solid #c0c0c0; }
    .leaderboard-entry:nth-child(3) { background: #1a0f00; border-left: 3px solid #cd7f32; }

    .rank { font-weight: bold; font-size: 0.95rem; }
    .rank-1 { color: #ffd700; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }

    .score-count    { color: #4caf50; font-weight: bold; font-size: 0.95rem; }
    .score-time-val { color: #ff6a00; font-weight: bold; font-size: 0.95rem; }

    .pb-badge {
      display: inline-block;
      background: #ff6a00;
      color: #fff;
      font-size: 0.62rem;
      padding: 2px 5px;
      border-radius: 10px;
      margin-left: 5px;
      font-weight: bold;
      animation: pulse 1s ease infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.7; }
      to   { opacity: 1; }
    }

    .entry-date { font-size: 0.68rem; color: #555; }

    /* ── Entry Action Buttons ── */
    .entry-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: flex-end;
    }

    .entry-action-btn {
      background: none;
      border: 1px solid transparent;
      color: #444;
      cursor: pointer;
      font-size: 0.72rem;
      padding: 3px 7px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .entry-action-btn.edit:hover {
      background: #1a3a5c;
      border-color: #3a8fd4;
      color: #3a8fd4;
    }

    .entry-action-btn.delete:hover {
      background: #3a1a1a;
      border-color: #c0392b;
      color: #c0392b;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #444;
      background: #1a1a1a;
      border-radius: 0 0 8px 8px;
    }

    /* ── Modals ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: #1a1a1a;
      border: 1px solid #ff6a00;
      border-radius: 12px;
      padding: 28px;
      width: 90%;
      max-width: 420px;
    }

    .modal h2 {
      color: #ff6a00;
      margin-bottom: 20px;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .modal-buttons { display: flex; gap: 10px; margin-top: 16px; }
    .modal-buttons .btn { flex: 1; }

    /* Edit modal specific */
    .edit-modal-info {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .edit-modal-info .player-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .edit-modal-info .current-score {
      font-size: 0.8rem;
      color: #888;
    }

    .edit-modal-info .current-score span {
      color: #ff6a00;
      font-weight: bold;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #ff6a00;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.88rem;
      z-index: 9999;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    /* ════════════════════════════════════════
       PRESENTATION VIEW
    ════════════════════════════════════════ */
    #presentationView {
      background: #000;
      min-height: 100vh;
      flex-direction: column;
    }

    .pres-header {
      background: #000;
      border-bottom: 4px solid #ff6a00;
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pres-header img { height: 60px; }

    .pres-header-center h1 {
      font-size: 2.4rem;
      color: #ff6a00;
      letter-spacing: 5px;
      text-transform: uppercase;
      text-align: center;
    }

    .pres-header-center p {
      text-align: center;
      color: #666;
      font-size: 0.8rem;
      letter-spacing: 3px;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .pres-sync {
      font-size: 0.75rem;
      color: #4caf50;
      letter-spacing: 1px;
    }

    .pres-body {
      flex: 1;
      padding: 30px 40px;
      display: flex;
      flex-direction: column;
    }

    .pres-drill-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .pres-drill-tab {
      padding: 10px 22px;
      border-radius: 30px;
      border: 2px solid #333;
      background: #111;
      color: #666;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s;
    }

    .pres-drill-tab.active {
      border-color: #ff6a00;
      background: #ff6a00;
      color: #fff;
    }

    .pres-drill-tab:hover { border-color: #ff6a00; color: #fff; }

    .pres-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .pres-auto-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid #ff6a00;
      background: transparent;
      color: #ff6a00;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .pres-auto-btn.on { background: #ff6a00; color: #fff; }

    .pres-rotate-bar {
      flex: 1;
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }

    .pres-rotate-fill {
      height: 100%;
      background: #ff6a00;
      width: 0%;
      transition: width 0.1s linear;
    }

    .pres-drill-title {
      font-size: 2rem;
      color: #ff6a00;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 6px;
    }

    .pres-drill-subtitle {
      font-size: 0.8rem;
      color: #555;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .pres-leaderboard {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
    }

    .pres-lb-header {
      background: #ff6a00;
      display: grid;
      grid-template-columns: 80px 1fr 160px;
      padding: 14px 24px;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .pres-lb-entry {
      display: grid;
      grid-template-columns: 80px 1fr 160px;
      padding: 0 24px;
      height: 0;
      overflow: hidden;
      background: #111;
      border-bottom: 1px solid #1a1a1a;
      align-items: center;
      transition: all 0.4s ease;
      opacity: 0;
    }

    .pres-lb-entry.visible {
      height: 62px;
      opacity: 1;
    }

    .pres-lb-entry:nth-child(2) { background: #1a1500; border-left: 4px solid #ffd700; }
    .pres-lb-entry:nth-child(3) { background: #161616; border-left: 4px solid #c0c0c0; }
    .pres-lb-entry:nth-child(4) { background: #1a0f00; border-left: 4px solid #cd7f32; }
    .pres-lb-entry:nth-child(n+5) { border-left: 4px solid #222; }

    .pres-rank { font-size: 1.6rem; font-weight: 900; }
    .pres-rank-1 { color: #ffd700; }
    .pres-rank-2 { color: #c0c0c0; }
    .pres-rank-3 { color: #cd7f32; }
    .pres-rank-n { color: #444; font-size: 1.1rem; }

    .pres-name { font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; }

    .pres-pb {
      display: inline-block;
      background: #ff6a00;
      color: #fff;
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 10px;
      margin-left: 10px;
      font-weight: bold;
      vertical-align: middle;
      animation: pulse 1s ease infinite alternate;
    }

    .pres-score { font-size: 1.6rem; font-weight: 900; text-align: right; }
    .pres-score-count { color: #4caf50; }
    .pres-score-time  { color: #ff6a00; }

    .pres-empty {
      text-align: center;
      padding: 80px 20px;
      color: #333;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    .pres-ticker {
      background: #111;
      border-top: 2px solid #ff6a00;
      padding: 10px 0;
      overflow: hidden;
      white-space: nowrap;
      margin-top: 20px;
    }

    .pres-ticker-inner {
      display: inline-block;
      animation: ticker 30s linear infinite;
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 2px;
    }

    @keyframes ticker {
      from { transform: translateX(100vw); }
      to   { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

<!-- Mode Toggle -->
<div class="mode-toggle">
  <button class="mode-btn active" id="btnAdmin"   onclick="setMode('admin')">⚙️ Admin</button>
  <button class="mode-btn"        id="btnPresent" onclick="setMode('presentation')">📺 TV Mode</button>
</div>

<!-- ════════════════════════════════════════
     ADMIN VIEW
════════════════════════════════════════ -->
<div id="adminView">
  <header>
    <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="BBTF Logo" />
    <h1>Breakdown Leaderboard</h1>
    <span id="syncStatus" class="sync-status sync-syncing">⏳ Connecting...</span>
  </header>

  <div class="container">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="label">Total Drills</div>
        <div class="value" id="statDrills">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Entries</div>
        <div class="value" id="statEntries">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Current Leader</div>
        <div class="value" id="statLeader">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Best Score</div>
        <div class="value" id="statBest">—</div>
      </div>
    </div>

    <div class="tabs-wrapper" id="tabsWrapper"></div>
    <div id="drillPanels"></div>
  </div>
</div>

<!-- ════════════════════════════════════════
     PRESENTATION VIEW
════════════════════════════════════════ -->
<div id="presentationView">
  <div class="pres-header">
    <img src="https://cdn.prod.website-files.com/6480170c6a03f88dd25b8819/651f46749b264a0294c66921_BBTFlogo.webp" alt="Logo" />
    <div class="pres-header-center">
      <h1>Breakdown Leaderboard</h1>
      <p>Live Rankings — Updated in Real Time</p>
    </div>
    <div class="pres-sync" id="presSync">🟢 LIVE</div>
  </div>

  <div class="pres-body">
    <div class="pres-controls">
      <button class="pres-auto-btn" id="autoRotateBtn" onclick="toggleAutoRotate()">▶ Auto Rotate</button>
      <div class="pres-rotate-bar">
        <div class="pres-rotate-fill" id="rotateFill"></div>
      </div>
    </div>

    <div class="pres-drill-tabs" id="presDrillTabs"></div>

    <div class="pres-drill-title"    id="presDrillTitle">—</div>
    <div class="pres-drill-subtitle" id="presDrillSubtitle">—</div>

    <div class="pres-leaderboard">
      <div class="pres-lb-header">
        <div>Rank</div>
        <div>Player</div>
        <div style="text-align:right">Score</div>
      </div>
      <div id="presLeaderboardList"></div>
    </div>
  </div>

  <div class="pres-ticker">
    <span class="pres-ticker-inner" id="presTicker">Loading scores...</span>
  </div>
</div>

<!-- ── Add Drill Modal ── -->
<div class="modal-overlay" id="addDrillModal">
  <div class="modal">
    <h2>➕ New Drill</h2>
    <div class="form-group">
      <label>Drill Name</label>
      <input type="text" id="newDrillName" placeholder="e.g. 30s Lane Touch" />
    </div>
    <div class="form-group">
      <label>Scoring Type</label>
      <select id="newDrillType">
        <option value="time">Time — Lower is Better (seconds)</option>
        <option value="count">Count — Higher is Better (reps)</option>
      </select>
    </div>
    <div class="modal-buttons">
      <button class="btn btn-secondary" onclick="closeAddDrillModal()">Cancel</button>
      <button class="btn btn-primary"   onclick="confirmAddDrill()">Create Drill</button>
    </div>
  </div>
</div>

<!-- ── Edit Score Modal ── -->
<div class="modal-overlay" id="editScoreModal">
  <div class="modal">
    <h2>✏️ Edit Score</h2>

    <div class="edit-modal-info">
      <div class="player-name" id="editPlayerName">—</div>
      <div class="current-score">
        Current score: <span id="editCurrentScore">—</span>
      </div>
    </div>

    <div class="form-group">
      <label id="editScoreLabel">New Score</label>
      <input type="number" id="editScoreInput"
             placeholder="Enter new score"
             step="0.1" min="0" />
    </div>

    <div class="form-group">
      <label>Update Reason <span style="color:#555">(optional)</span></label>
      <input type="text" id="editReason"
             placeholder="e.g. Corrected entry, re-attempt" />
    </div>

    <div class="modal-buttons">
      <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-primary"   onclick="confirmEditScore()">Save Changes</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ════════════════════════════════════════
     FIREBASE + APP LOGIC
════════════════════════════════════════ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, doc,
    setDoc, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC4z5XoaXACyqVgWX5Ie5Mp7u0ySYmm6BE",
    authDomain: "breakdown-leaderboard.firebaseapp.com",
    projectId: "breakdown-leaderboard",
    storageBucket: "breakdown-leaderboard.firebasestorage.app",
    messagingSenderId: "773986569435",
    appId: "1:773986569435:web:791eef9c2ad2a48f3ad0fe"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // ── State ────────────────────────────────────────────────────
  let drills           = {};
  let activeDrillId    = null;
  let presActiveDrillId = null;

  // Edit state
  let editDrillId  = null;
  let editEntryId  = null;

  // Auto-rotate
  let autoRotate      = false;
  let rotateFillTimer = null;
  const ROTATE_SECS   = 10;

  // ── Sync Status ──────────────────────────────────────────────
  function setSyncStatus(state) {
    const el  = document.getElementById('syncStatus');
    const pel = document.getElementById('presSync');
    if (state === 'online') {
      el.className   = 'sync-status sync-online';
      el.textContent = '🟢 Live Sync Active';
      if (pel) pel.textContent = '🟢 LIVE';
    } else if (state === 'offline') {
      el.className   = 'sync-status sync-offline';
      el.textContent = '🔴 Offline';
      if (pel) pel.textContent = '🔴 OFFLINE';
    } else {
      el.className   = 'sync-status sync-syncing';
      el.textContent = '⏳ Connecting...';
    }
  }

  // ── Firebase Listener ────────────────────────────────────────
  function startListening() {
    onSnapshot(collection(db, 'drills'), (snapshot) => {
      setSyncStatus('online');
      drills = {};
      snapshot.forEach(d => { drills[d.id] = d.data(); });

      const ids = Object.keys(drills);
      if (!activeDrillId && ids.length)                             activeDrillId = ids[0];
      if (activeDrillId && !drills[activeDrillId] && ids.length)   activeDrillId = ids[0];
      if (!presActiveDrillId && ids.length)                        presActiveDrillId = ids[0];
      if (presActiveDrillId && !drills[presActiveDrillId] && ids.length) presActiveDrillId = ids[0];

      renderAll();
    }, () => setSyncStatus('offline'));
  }

  // ── Render All ───────────────────────────────────────────────
  function renderAll() {
    renderTabs();
    renderPanels();
    renderStats();
    renderPresentation();
  }

  // ════════════════════════════════════════
  // ADMIN RENDERS
  // ════════════════════════════════════════

  function renderTabs() {
    const wrapper = document.getElementById('tabsWrapper');
    wrapper.innerHTML = '';
    Object.entries(drills).forEach(([id, drill]) => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (id === activeDrillId ? ' active' : '');
      tab.innerHTML = `
        <span onclick="switchDrill('${id}')">${drill.name}</span>
        <button class="delete-tab" onclick="deleteDrill('${id}')">✕</button>`;
      wrapper.appendChild(tab);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'add-drill-btn';
    addBtn.textContent = '+ Add Drill';
    addBtn.onclick = openAddDrillModal;
    wrapper.appendChild(addBtn);
  }

  function renderPanels() {
    const container = document.getElementById('drillPanels');
    container.innerHTML = '';

    if (!Object.keys(drills).length) {
      container.innerHTML = `
        <div style="text-align:center;padding:60px 20px;color:#444;">
          <div style="font-size:3rem;margin-bottom:16px;">🏉</div>
          <div>No drills yet. Click <strong style="color:#ff6a00">+ Add Drill</strong> to get started!</div>
        </div>`;
      return;
    }

    Object.entries(drills).forEach(([id, drill]) => {
      const isCount = drill.type === 'count';
      const entries = drill.entries || [];
      const sorted  = [...entries].sort((a, b) =>
        isCount ? b.score - a.score : a.score - b.score);

      const panel = document.createElement('div');
      panel.className = 'drill-panel' + (id === activeDrillId ? ' active' : '');

      panel.innerHTML = `
        <div class="panel-grid">
          <div class="card">
            <h3>➕ Add Score</h3>
            <div class="form-group">
              <label>Player Name</label>
              <input type="text" id="name-${id}" placeholder="Enter player name" />
            </div>
            <div class="form-group">
              <label>${isCount ? 'Count (reps)' : 'Time (seconds, e.g. 20.4)'}</label>
              <input type="number" id="score-${id}"
                placeholder="${isCount ? 'e.g. 42' : 'e.g. 20.4'}"
                step="${isCount ? '1' : '0.1'}" min="0" />
            </div>
            <button class="btn btn-primary" onclick="addEntry('${id}')">Add to Leaderboard</button>
            <button class="btn btn-danger"  onclick="clearDrill('${id}')">🗑 Clear All Entries</button>
          </div>
          <div class="card">
            <h3>📊 Drill Info</h3>
            <div class="form-group">
              <label>Drill Name</label>
              <div style="color:#fff;padding:8px 0;">${drill.name}</div>
            </div>
            <div class="form-group">
              <label>Scoring Type</label>
              <div style="color:#ff6a00;padding:8px 0;">
                ${isCount ? '🔢 Count — Highest Wins' : '⏱ Time — Fastest Wins'}
              </div>
            </div>
            <div class="form-group">
              <label>Entries</label>
              <div style="color:#fff;padding:8px 0;">${entries.length} / 50</div>
            </div>
            <div class="form-group">
              <label>Leader</label>
              <div style="color:#ffd700;padding:8px 0;">
                ${sorted.length
                  ? `🏆 ${sorted[0].name} — ${fmt(sorted[0].score, isCount)}`
                  : '—'}
              </div>
            </div>
          </div>
        </div>

        <div class="leaderboard-header">
          <div>Rank</div>
          <div>Player</div>
          <div>${isCount ? 'Count' : 'Time'}</div>
          <div>Recorded / Actions</div>
        </div>
        <div class="leaderboard-list">
          ${sorted.length === 0
            ? `<div class="empty-state">
                 <div style="font-size:2.5rem">📋</div>
                 <div>No entries yet</div>
               </div>`
            : sorted.slice(0, 50).map((e, i) => `
              <div class="leaderboard-entry">
                <div class="rank rank-${i+1}">${rankIcon(i+1)}</div>
                <div>
                  ${e.name}
                  ${e.isPB ? '<span class="pb-badge">NEW PB 🔥</span>' : ''}
                  ${e.editedAt
                    ? `<span style="font-size:0.62rem;color:#555;margin-left:6px;">✏️ edited</span>`
                    : ''}
                </div>
                <div class="${isCount ? 'score-count' : 'score-time-val'}">
                  ${fmt(e.score, isCount)}
                </div>
                <div>
                  <div class="entry-date">${e.date || '—'}</div>
                  <div class="entry-actions">
                    <button class="entry-action-btn edit"
                      onclick="openEditModal('${id}','${e.id}')">✏️ Edit</button>
                    <button class="entry-action-btn delete"
                      onclick="deleteEntry('${id}','${e.id}')">✕</button>
                  </div>
                </div>
              </div>`).join('')
          }
        </div>`;
      container.appendChild(panel);
    });
  }

  function renderStats() {
    const ids = Object.keys(drills);
    document.getElementById('statDrills').textContent = ids.length;

    let total = 0, leader = '—', best = '—';
    if (activeDrillId && drills[activeDrillId]) {
      const d  = drills[activeDrillId];
      const ic = d.type === 'count';
      const en = d.entries || [];
      total    = en.length;
      const s  = [...en].sort((a, b) => ic ? b.score - a.score : a.score - b.score);
      if (s.length) { leader = s[0].name; best = fmt(s[0].score, ic); }
    } else {
      ids.forEach(id => { total += (drills[id].entries || []).length; });
    }
    document.getElementById('statEntries').textContent = total;
    document.getElementById('statLeader').textContent  = leader;
    document.getElementById('statBest').textContent    = best;
  }

  // ════════════════════════════════════════
  // PRESENTATION RENDERS
  // ════════════════════════════════════════

  function renderPresentation() {
    renderPresTabs();
    renderPresBoard();
    renderPresTicker();
  }

  function renderPresTabs() {
    const wrap = document.getElementById('presDrillTabs');
    wrap.innerHTML = '';
    Object.entries(drills).forEach(([id, drill]) => {
      const btn = document.createElement('button');
      btn.className = 'pres-drill-tab' + (id === presActiveDrillId ? ' active' : '');
      btn.textContent = drill.name;
      btn.onclick = () => { presActiveDrillId = id; renderPresentation(); };
      wrap.appendChild(btn);
    });
  }

  function renderPresBoard() {
    if (!presActiveDrillId || !drills[presActiveDrillId]) {
      document.getElementById('presDrillTitle').textContent    = 'No Drills';
      document.getElementById('presDrillSubtitle').textContent = 'Add a drill in Admin mode';
      document.getElementById('presLeaderboardList').innerHTML =
        `<div class="pres-empty">🏉 No drills created yet</div>`;
      return;
    }

    const drill   = drills[presActiveDrillId];
    const isCount = drill.type === 'count';
    const entries = drill.entries || [];
    const sorted  = [...entries].sort((a, b) =>
      isCount ? b.score - a.score : a.score - b.score);

    document.getElementById('presDrillTitle').textContent    = drill.name.toUpperCase();
    document.getElementById('presDrillSubtitle').textContent =
      isCount ? '🔢 HIGHEST COUNT WINS' : '⏱ FASTEST TIME WINS';

    const list = document.getElementById('presLeaderboardList');
    list.innerHTML = '';

    if (!sorted.length) {
      list.innerHTML = `<div class="pres-empty">📋 No entries yet for this drill</div>`;
      return;
    }

    sorted.slice(0, 10).forEach((entry, i) => {
      const row = document.createElement('div');
      row.className = 'pres-lb-entry';

      const rankClass = i === 0 ? 'pres-rank-1'
                      : i === 1 ? 'pres-rank-2'
                      : i === 2 ? 'pres-rank-3'
                      : 'pres-rank-n';

      row.innerHTML = `
        <div class="pres-rank ${rankClass}">${rankIcon(i+1)}</div>
        <div class="pres-name">
          ${entry.name}
          ${entry.isPB ? '<span class="pres-pb">NEW PB 🔥</span>' : ''}
        </div>
        <div class="pres-score ${isCount ? 'pres-score-count' : 'pres-score-time'}">
          ${fmt(entry.score, isCount)}
        </div>`;

      list.appendChild(row);
      setTimeout(() => row.classList.add('visible'), i * 80);
    });
  }

  function renderPresTicker() {
    const parts = [];
    Object.values(drills).forEach(drill => {
      const isCount = drill.type === 'count';
      const entries = drill.entries || [];
      const sorted  = [...entries].sort((a, b) =>
        isCount ? b.score - a.score : a.score - b.score);
      if (sorted.length) {
        parts.push(
          `🏆 ${drill.name.toUpperCase()}: ${sorted[0].name} — ${fmt(sorted[0].score, isCount)}`
        );
      }
    });
    document.getElementById('presTicker').textContent =
      parts.length ? parts.join('   •••   ') + '   •••   ' : 'No scores yet — be the first!';
  }

  // ── Auto Rotate ──────────────────────────────────────────────
  window.toggleAutoRotate = function () {
    autoRotate = !autoRotate;
    const btn  = document.getElementById('autoRotateBtn');
    btn.textContent = autoRotate ? '⏸ Auto Rotate ON' : '▶ Auto Rotate';
    btn.classList.toggle('on', autoRotate);
    autoRotate ? startRotate() : stopRotate();
  };

  function startRotate() {
    stopRotate();
    let elapsed = 0;
    const fill  = document.getElementById('rotateFill');
    rotateFillTimer = setInterval(() => {
      elapsed += 0.1;
      fill.style.width = ((elapsed / ROTATE_SECS) * 100) + '%';
      if (elapsed >= ROTATE_SECS) { elapsed = 0; nextDrill(); }
    }, 100);
  }

  function stopRotate() {
    clearInterval(rotateFillTimer);
    document.getElementById('rotateFill').style.width = '0%';
  }

  function nextDrill() {
    const ids = Object.keys(drills);
    if (!ids.length) return;
    const idx = ids.indexOf(presActiveDrillId);
    presActiveDrillId = ids[(idx + 1) % ids.length];
    renderPresentation();
  }

  // ════════════════════════════════════════
  // MODE TOGGLE
  // ════════════════════════════════════════
  window.setMode = function (mode) {
    document.getElementById('adminView').style.display        = mode === 'admin'        ? 'block' : 'none';
    document.getElementById('presentationView').style.display = mode === 'presentation' ? 'flex'  : 'none';
    document.getElementById('btnAdmin').classList.toggle('active',   mode === 'admin');
    document.getElementById('btnPresent').classList.toggle('active', mode === 'presentation');
    if (mode === 'presentation') renderPresentation();
  };

  // ════════════════════════════════════════
  // ADMIN ACTIONS
  // ════════════════════════════════════════
  window.switchDrill = id => { activeDrillId = id; renderAll(); };

  window.addEntry = async function (drillId) {
    const nameEl  = document.getElementById(`name-${drillId}`);
    const scoreEl = document.getElementById(`score-${drillId}`);
    const name    = nameEl.value.trim();
    const score   = parseFloat(scoreEl.value);

    if (!name)                  { showToast('⚠️ Enter a player name');  return; }
    if (isNaN(score) || score < 0) { showToast('⚠️ Enter a valid score'); return; }

    const drill   = drills[drillId];
    const isCount = drill.type === 'count';
    const entries = drill.entries || [];
    if (entries.length >= 50)   { showToast('⚠️ Max 50 entries reached'); return; }

    // PB check
    const prev = entries.filter(e => e.name.toLowerCase() === name.toLowerCase());
    let isPB   = !prev.length;
    if (!isPB) {
      const best = isCount
        ? Math.max(...prev.map(e => e.score))
        : Math.min(...prev.map(e => e.score));
      isPB = isCount ? score > best : score < best;
    }

    const dateStr = new Date().toLocaleDateString('en-AU', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

    const newEntry = { id: genId(), name, score, isPB, date: dateStr };

    try {
      await setDoc(doc(db, 'drills', drillId), {
        ...drill,
        entries: [...entries, newEntry]
      });
      nameEl.value  = '';
      scoreEl.value = '';
      showToast(isPB ? `🔥 NEW PB for ${name}!` : `✅ Score added for ${name}`);
    } catch { showToast('❌ Error saving. Check connection.'); }
  };

  // ── Edit Score ───────────────────────────────────────────────
  window.openEditModal = function (drillId, entryId) {
    const drill   = drills[drillId];
    const isCount = drill.type === 'count';
    const entry   = (drill.entries || []).find(e => e.id === entryId);
    if (!entry) return;

    editDrillId = drillId;
    editEntryId = entryId;

    document.getElementById('editPlayerName').textContent  = entry.name;
    document.getElementById('editCurrentScore').textContent = fmt(entry.score, isCount);
    document.getElementById('editScoreLabel').textContent  =
      isCount ? 'New Count (reps)' : 'New Time (seconds, e.g. 20.4)';

    const input = document.getElementById('editScoreInput');
    input.value       = entry.score;
    input.step        = isCount ? '1' : '0.1';
    input.placeholder = isCount ? 'e.g. 42' : 'e.g. 20.4';

    document.getElementById('editReason').value = '';
    document.getElementById('editScoreModal').classList.add('open');
    setTimeout(() => input.focus(), 100);
  };

  window.closeEditModal = function () {
    document.getElementById('editScoreModal').classList.remove('open');
    editDrillId = null;
    editEntryId = null;
  };

  window.confirmEditScore = async function () {
    const newScore = parseFloat(document.getElementById('editScoreInput').value);
    if (isNaN(newScore) || newScore < 0) { showToast('⚠️ Enter a valid score'); return; }

    const drill   = drills[editDrillId];
    const isCount = drill.type === 'count';
    const entries = drill.entries || [];
    const idx     = entries.findIndex(e => e.id === editEntryId);
    if (idx === -1) { showToast('❌ Entry not found'); return; }

    const entry    = entries[idx];
    const oldScore = entry.score;

    // Recalculate PB against all OTHER entries for this player
    const others = entries.filter(e =>
      e.id !== editEntryId &&
      e.name.toLowerCase() === entry.name.toLowerCase()
    );

    let isPB = !others.length;
    if (!isPB) {
      const best = isCount
        ? Math.max(...others.map(e => e.score))
        : Math.min(...others.map(e => e.score));
      isPB = isCount ? newScore > best : newScore < best;
    }

    const editedAt = new Date().toLocaleDateString('en-AU', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

    const updatedEntry = {
      ...entry,
      score:    newScore,
      isPB,
      editedAt,
      editNote: document.getElementById('editReason').value.trim() || null
    };

    const updatedEntries = [...entries];
    updatedEntries[idx]  = updatedEntry;

    try {
      await setDoc(doc(db, 'drills', editDrillId), {
        ...drill,
        entries: updatedEntries
      });
      closeEditModal();
      const direction = isCount
        ? (newScore > oldScore ? '⬆️ improved' : newScore < oldScore ? '⬇️ lowered' : '↔️ unchanged')
        : (newScore < oldScore ? '⬆️ improved' : newScore > oldScore ? '⬇️ lowered' : '↔️ unchanged');
      showToast(`✅ Score updated for ${entry.name} — ${direction}`);
    } catch { showToast('❌ Error updating score'); }
  };

  // ── Delete ───────────────────────────────────────────────────
  window.deleteEntry = async function (drillId, entryId) {
    if (!confirm('Delete this entry?')) return;
    const drill = drills[drillId];
    try {
      await setDoc(doc(db, 'drills', drillId), {
        ...drill,
        entries: (drill.entries || []).filter(e => e.id !== entryId)
      });
      showToast('🗑 Entry deleted');
    } catch { showToast('❌ Error deleting entry'); }
  };

  window.clearDrill = async function (drillId) {
    if (!confirm('Clear ALL entries? This cannot be undone.')) return;
    const drill = drills[drillId];
    try {
      await setDoc(doc(db, 'drills', drillId), { ...drill, entries: [] });
      showToast('🗑 All entries cleared');
    } catch { showToast('❌ Error clearing'); }
  };

  window.deleteDrill = async function (drillId) {
    if (!confirm(`Delete "${drills[drillId].name}"? This cannot be undone.`)) return;
    try {
      await deleteDoc(doc(db, 'drills', drillId));
      if (activeDrillId     === drillId) activeDrillId     = null;
      if (presActiveDrillId === drillId) presActiveDrillId = null;
      showToast('🗑 Drill deleted');
    } catch { showToast('❌ Error deleting drill'); }
  };

  // ── Drill Modals ─────────────────────────────────────────────
  window.openAddDrillModal = function () {
    document.getElementById('newDrillName').value = '';
    document.getElementById('newDrillType').value = 'time';
    document.getElementById('addDrillModal').classList.add('open');
  };

  window.closeAddDrillModal = function () {
    document.getElementById('addDrillModal').classList.remove('open');
  };

  window.confirmAddDrill = async function () {
    const name = document.getElementById('newDrillName').value.trim();
    const type = document.getElementById('newDrillType').value;
    if (!name) { showToast('⚠️ Enter a drill name'); return; }
    const id = genId();
    try {
      await setDoc(doc(db, 'drills', id), {
        name, type, entries: [],
        createdAt: new Date().toISOString()
      });
      activeDrillId = id;
      closeAddDrillModal();
      showToast(`✅ Drill "${name}" created!`);
    } catch { showToast('❌ Error creating drill'); }
  };

  // ── Helpers ──────────────────────────────────────────────────
  function fmt(score, isCount) {
    return isCount ? `${score} reps` : `${parseFloat(score).toFixed(2)}s`;
  }

  function rankIcon(r) {
    return r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : `#${r}`;
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Boot ─────────────────────────────────────────────────────
  startListening();
</script>
</body>
</html>
